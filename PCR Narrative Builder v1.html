/* PCR Narrative Builder v1 — stylesheet: clinical editorial skin (reconciled to engine markup). Light mode only. */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body { min-height: 100%; }
body {
  margin: 0; background: #F7F4ED; color: #23201A;
  font-family: 'Archivo', system-ui, -apple-system, sans-serif;
  font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
:root {
  --paper: #F7F4ED; --sheet: #FCFAF4;
  --ink: #23201A; --ink-hover: #3A362E;
  --text: #23201A; --text-dim: #5F594C; --text-faint: #5F594C; --text-label: #5F594C; --text-2: #4A463D;
  --border: #DFD8C9; --border-strong: #CCC3B0; --input-rule: #9A8F78; --placeholder: #756D5D;
  --green-bg: #E7EDE4; --green-text: #3E6B4F; --green-border: #BFD3C5;
  --amber-bg: #F3ECD9; --amber-text: #8A6D2F;
  --gray-bg: #EFEBE1; --gray-text: #6B655B;
  --red-bg: #F3E3DD; --red-text: #A63A2B; --red-border: #D8B0A4;
  --tint: #F2EEE3;
  --serif: 'Source Serif 4', 'Iowan Old Style', Charter, Georgia, serif;
  --sans: 'Archivo', system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 8px; --radius-sm: 6px; --focus-ring: #23201A;
}
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.ws-field:focus-visible { outline-offset: -1px; }

/* ---- topbar ---- */
#topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: var(--paper); border-bottom: 1px solid var(--ink);
  padding: 10px 16px; position: sticky; top: 0; z-index: 40;
}
#topbar .brand { display: flex; align-items: baseline; gap: 8px; font-family: var(--serif); font-size: 19px; font-weight: 600; white-space: nowrap; }
#version-tag { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--text-dim); }
.topbar-controls { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.tb-field { display: inline-flex; align-items: center; gap: 5px; }
.tb-label { font-size: 11px; color: var(--text-faint); }
select {
  font: inherit; font-size: 13px; color: var(--text); background: var(--sheet);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  height: 30px; padding: 0 8px;
}
input[type="text"] {
  font: inherit; font-size: 13px; color: var(--text); background: transparent;
  border: none; border-bottom: 1.5px solid var(--input-rule); border-radius: 0;
  height: 30px; padding: 0 8px;
}
input[type="text"]::placeholder { font-style: italic; color: var(--placeholder); }
input[type="text"]:focus-visible { border-bottom-color: var(--ink); }
select:hover { border-color: var(--input-rule); background: var(--paper); }
input[type="text"]:hover { border-bottom-color: var(--ink); }
#category-select { min-width: 230px; }
#unit-other { width: 6em; }
button {
  font: inherit; font-size: 13px; cursor: pointer; border-radius: var(--radius-sm);
  height: 30px; padding: 0 12px; background: var(--sheet);
  border: 1px solid var(--border-strong); color: var(--text);
}
button:hover { background: var(--paper); border-color: var(--input-rule); }
button:active { background: var(--tint); }
#new-call { border-color: var(--red-border); color: var(--red-text); }
#new-call:hover { background: var(--red-bg); }
#new-call { position: relative; margin-left: 28px; }
#new-call::before { content: ""; position: absolute; left: -18px; top: 2px; bottom: 2px; width: 1px; background: var(--border); }
.add-block-wrap { position: relative; margin-left: 10px; padding-left: 20px; border-left: 1px solid var(--border); }
#add-block-popup {
  position: absolute; top: 34px; left: 0; z-index: 50; background: var(--sheet);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(60,50,30,.18); padding: 6px; min-width: 240px;
  max-height: 60vh; overflow-y: auto;
}
.popup-row {
  display: block; width: 100%; text-align: left; background: transparent;
  border: none; height: auto; padding: 7px 10px; font-size: 13px; border-radius: 5px; color: var(--text);
}
.popup-row:hover { background: var(--tint); color: var(--ink); }
.popup-head { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); font-weight: 500; padding: 7px 10px 2px; }
.popup-head + .popup-head, .popup-row + .popup-head { border-top: 0.5px solid var(--border); margin-top: 4px; }
#draft-switcher { display: inline-flex; gap: 2px; background: var(--gray-bg); border-radius: var(--radius-sm); padding: 2px; }
.draft-tab { border: none; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; font-size: 12px; color: var(--text-dim); }
.draft-tab:hover { background: rgba(35,32,26,.05); }
.draft-tab.active { background: var(--sheet); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(60,50,30,.1); }

/* ---- panes: worksheet | prose ---- */
#panes {
  display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr);
  align-items: start; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto;
}
#form-pane { min-width: 0; }
#preview-pane {
  min-width: 0; position: sticky; top: 66px; align-self: start;
  max-height: calc(100vh - 84px); display: flex; flex-direction: column;
  background: var(--sheet); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
#keyhint-bar {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);
  background: var(--paper); border-bottom: 1px solid var(--border); padding: 5px 16px;
}
#statusbar { font-family: var(--mono); font-size: 11px; color: var(--text-dim); padding: 6px 16px; border-top: 1px solid var(--border); background: var(--paper); position: sticky; bottom: 0; z-index: 30; }

/* ---- worksheet ---- */
#worksheet { display: flex; flex-direction: column; gap: 20px; }
.ws-sec { display: flex; flex-direction: column; }
.ws-sechead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-bottom: 3px;
}
.ws-secname { font-family: var(--sans); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .11em; color: var(--text-faint); margin: 0; }
.ws-sectools { display: flex; gap: 6px; align-items: center; }
.ws-rows { display: flex; flex-direction: column; }
.ws-sec.ws-na .ws-rows { opacity: .55; }
.ws-note { font-size: 11px; color: var(--text-faint); line-height: 1.5; padding: 5px 8px; }
.ws-subhead { font-size: 11px; font-weight: 500; color: var(--text-faint); padding: 9px 8px 3px; }
.ws-sub { display: flex; flex-direction: column; margin-left: 14px; padding-left: 10px; border-left: 2px solid var(--border); }
.ws-sec .sub-row { padding: 6px 8px 4px; }
.ws-sec .handoff-btn { margin: 8px 8px 0; }
.ws-sec .pt-contact { padding: 6px 8px; }

/* padding and alignment are the same in both states: moving the cursor must not
   shift the rows around it — only the box changes. */
/* one field per row, reading inline as "label: value". Padding and alignment are the
   same focused or not: moving the cursor must not shift the rows around it. */
.ws-row {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px;
  padding: 5px 8px; font-size: 13px;
  border: 1px solid transparent; border-radius: var(--radius-sm); scroll-margin-top: 78px;
}
.ws-row:hover { background: var(--tint); }
.ws-row.ws-focused {
  align-items: center;
  background: var(--sheet); border-color: var(--ink); box-shadow: 0 1px 3px rgba(60,50,30,.10);
}
/* a field after a line's first (component pills, and the sum row that reads with
   them) indents as a sub-row, same idea as .ws-sub but scoped to one line. */
.ws-row.ws-sub-1 { margin-left: 14px; padding-left: 6px; border-left: 2px solid var(--border); }
/* wraps at spaces, hyphens, and the zero-width breaks wrapLabel puts after each "/" —
   never mid-word (break-word is only a last resort for a token wider than the row) */
.ws-label, .ws-flabel { overflow-wrap: break-word; word-break: normal; }
.ws-label { font-size: 11.5px; color: var(--text-2); letter-spacing: .03em; }
.ws-rownote { flex-basis: 100%; font-size: 11px; color: var(--text-faint); display: none; }
.ws-row.ws-focused .ws-rownote { display: block; }
.ws-deferred .ws-label { color: var(--text-faint); }
.ws-literal .ws-litval { color: var(--text-faint); font-style: italic; min-width: 0; }

/* field states: confirmed / proposed / amber */
.ws-field { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 4px; max-width: 100%; border-radius: 3px; }
.ws-flabel { font-size: 11px; color: var(--text-faint); }
.ws-fval { overflow-wrap: anywhere; }
.ws-check { font-size: 10px; color: var(--green-text); }
.ws-set .ws-fval { color: var(--ink); }
.ws-idle .ws-fval { color: var(--text-faint); }
/* a settled structural decision keeps its clinical colour */
.ws-field .ws-fval.tone-fired { color: var(--red-text); font-weight: 500; }
.ws-field .ws-fval.tone-given { color: var(--green-text); }
.ws-field .ws-fval.tone-withheld { color: var(--amber-text); }
.ws-proposed .ws-fval { color: var(--text-dim); font-style: italic; }
.ws-amber .ws-fval {
  color: var(--amber-text); font-style: italic;
  border-bottom: 1px dotted var(--amber-text); padding-bottom: 1px;
}
.ws-open .ws-fval { color: var(--green-text); }
/* a computed sum row: read-only, never a "field" for focus purposes — see
   sumFieldNode(). Its value prints in the mono font like a typed number would. */
.ws-sumfield { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; max-width: 100%; }
.ws-sumval { font-family: var(--mono); color: var(--ink); }
.ws-sumval.ws-sumval-empty { color: var(--text-faint); }
.ws-sumauto { font-style: italic; opacity: .7; }

/* the cursor's field: its real control, in an accent box */
.ws-field.ws-editing { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ws-ctl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; max-width: 100%; }
.ws-opts { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.ws-ctl input[type="text"] { height: 26px; font-size: 13px; }
/* a blank whose placeholder IS the proposal Enter would accept — dashed rule, matching
   the dashed proposal pills, so it never reads as an ordinary "type something" hint */
.ws-ctl input.proposal { border-bottom-style: dashed; }
.ws-ctl input.proposal::placeholder { font-style: italic; color: var(--text-dim); opacity: 1; }
.ws-keyhint { font-family: var(--mono); font-size: 10px; color: var(--text-faint); white-space: nowrap; }
.ws-inline-note { font-size: 11px; color: var(--text-faint); font-style: italic; }
.ws-openbtn { height: 24px; padding: 0 10px; font-size: 12px; color: var(--green-text); background: transparent; border: 1px dashed var(--border-strong); }
.ws-openbtn:hover { background: var(--green-bg); border-color: var(--green-border); }
.pill.hl, .chip.hl { box-shadow: 0 0 0 1.5px var(--ink) inset; }
.pill.prop, .chip.prop { border-style: dashed; color: var(--text-dim); font-style: italic; }
/* the structural decisions carry the same colours the old segmented control did */
.ws-opts button[data-opt="fired"].on { background: var(--red-bg); color: var(--red-text); border-color: var(--red-border); }
.ws-opts button[data-opt="given"].on { background: #DCE6D8; color: var(--green-text); border-color: var(--green-border); }
.ws-opts button[data-opt="withheld"].on { background: #EFE3C4; color: var(--amber-text); border-color: #D8C48E; }
.ws-opts button[data-opt="omit"].on, .ws-opts button[data-opt="normal"].on { background: #E6E1D3; color: #57503F; border-color: #A89D86; }
.rm-block { width: 24px; height: 24px; padding: 0; line-height: 1; border-radius: 50%; color: var(--text-dim); font-size: 14px; }
.rm-block:hover { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
.na-toggle { height: 22px; padding: 0 10px; font-size: 11px; border-radius: 999px; color: var(--text-dim); background: transparent; border: 1px solid var(--border-strong); }
.na-toggle.on { background: var(--gray-bg); color: var(--gray-text); font-weight: 500; }
.pt-contact { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.sub-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
.sub-pill { height: 26px; padding: 0 12px; font-size: 12px; border-radius: 999px; }
.sub-pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 500; }
.handoff-btn { align-self: flex-start; border-color: var(--green-border); color: var(--green-text); background: var(--green-bg); }
.handoff-btn:hover { background: #D9E3D7; }
input.time { font-variant-numeric: tabular-nums; }
input.time.bad { border-bottom-color: var(--red-text); box-shadow: 0 0 0 1px var(--red-text) inset; }

/* ---- ordering: drag handles, paragraph badges ---- */
/* piece 4 wires the drag itself; this only reserves the geometry and paints the
   badge, so a pristine draft is unchanged but for the gutter and the pill. */
.ws-line { display: flex; align-items: flex-start; gap: 6px; }
.ws-line-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.ws-line.ws-loose { padding: 2px 0; }

.ws-handle {
  flex-shrink: 0; width: 20px; height: 27px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; cursor: grab; padding: 0; touch-action: none;
  opacity: 0; transition: opacity .12s ease;
}
.ws-line > .ws-handle { margin-top: 5px; }
.ws-line:hover > .ws-handle, .ws-handle:focus-visible, .ws-sec:hover > .ws-sechead .ws-handle { opacity: 1; }
@media (hover: none) { .ws-handle { opacity: 1; } }
.ws-dots {
  width: 10px; height: 15px; color: var(--text-faint);
  background-image: radial-gradient(circle, currentColor 1.2px, transparent 1.3px);
  background-size: 5px 5px;
}

/* base pill styling is shared by the per-line badge and the box's own badge (which
   lives in its sechead, not a .ws-line); only the .ws-line context also pins it to
   the top of the unit, aligned with the first row */
.ws-para {
  flex-shrink: 0; font-size: 10.5px; color: var(--text-faint);
  border: 1px solid var(--border); border-radius: 999px; padding: 0 6px;
}
.ws-line > .ws-para { align-self: flex-start; margin-top: 5px; }
.ws-para-moved { color: var(--amber-text); border-color: var(--amber-text); }

/* a box's sechead is the only one that ever carries data-unit (shell and disposition
   heads never do), so scoping the layout fix to that attribute keeps every other
   sechead's default space-between untouched by construction rather than by reasoning */
.ws-sec[data-unit] > .ws-sechead { justify-content: flex-start; }
.ws-sec[data-unit] > .ws-sechead > .ws-sectools { margin-left: auto; }

/* the drag lift needs an offset parent, and this is the only positioned ancestor
   between a unit and the page: without it, left/top would resolve against <body>. */
#worksheet { position: relative; }

/* drag-state hooks, wired by piece 4: .ws-lifted/.ws-drop-slot/body.ws-dragging back
   the pointer drag; .ws-kbgrab is its keyboard twin — same lifted look, but static in
   flow, since a grabbed-not-yet-moved unit hasn't left the document order. */
.ws-line.ws-lifted, .ws-sec.ws-lifted {
  position: absolute; z-index: 40; background: var(--sheet);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: 0 6px 16px rgba(60,50,30,.18);
}
.ws-line.ws-kbgrab, .ws-sec.ws-kbgrab {
  position: static; background: var(--sheet);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: 0 6px 16px rgba(60,50,30,.18);
}
.ws-drop-slot { border: 1px dashed var(--text-faint); border-radius: var(--radius-sm); background: var(--tint); }
body.ws-dragging { user-select: none; -webkit-user-select: none; }

/* ---- deletion: sentence/field × controls and the restore chip ---- */
/* both × controls are hover-revealed like the drag handle: a chart is read far more
   often than it is pruned, so removal must not be part of the resting picture. */
.ws-del {
  flex-shrink: 0; width: 18px; height: 18px; padding: 0; line-height: 1;
  border: 1px solid transparent; border-radius: 50%; background: transparent;
  color: var(--text-faint); font-size: 12px; opacity: 0; transition: opacity .12s ease;
}
.ws-del:hover { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
.ws-line > .ws-del-line { margin-top: 9px; }
.ws-line:hover > .ws-del-line, .ws-del-line:focus-visible { opacity: 1; }
.ws-row > .ws-del-field { margin-left: auto; }
.ws-row:hover > .ws-del-field, .ws-del-field:focus-visible { opacity: 1; }
@media (hover: none) { .ws-del { opacity: 1; } }

.ws-hidden-wrap { position: relative; display: inline-flex; }
.ws-hidden-chip {
  height: 20px; padding: 0 8px; font-size: 10.5px; color: var(--text-faint);
  background: transparent; border: 1px dashed var(--border); border-radius: 999px;
}
.ws-hidden-chip:hover { color: var(--ink); border-color: var(--border-strong); }
/* A twin already stated earlier reads as faded material; its handle and its × sit
   outside the body and stay at full strength — the sentence is dimmed, not disabled.
   The chip rides INSIDE the body, and opacity is not something a child can climb back
   out of, so it compensates with full-strength ink instead: it is the way out. */
.ws-line.ws-suppressed > .ws-line-body { opacity: .55; }
.ws-line.ws-suppressed .ws-twin-chip { color: var(--ink); border-color: var(--border-strong); }
.ws-twin-chip { margin-left: 6px; }
.ws-hidden-pop {
  position: absolute; top: 26px; right: 0; z-index: 50; background: var(--sheet);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(60,50,30,.18); padding: 6px; min-width: 220px;
  max-height: 50vh; overflow-y: auto;
}

/* ---- grouped rows: a line's later fields read as continuations of its first ---- */
.ws-sub-1 { margin-left: 18px; padding-left: 10px; border-left: 2px solid var(--border); border-radius: 0; }
.ws-sub-2 { margin-left: 36px; padding-left: 10px; border-left: 2px solid var(--border); border-radius: 0; }

/* ---- pills + chips (worksheet controls and the escalation modal) ---- */
.pill, .chip { height: 25px; padding: 0 11px; font-size: 12px; border-radius: 999px; vertical-align: baseline; }
.pill.on, .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 500; }
.modal-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.pill.aox-all { border: 1px dotted var(--green-text); color: var(--green-text); background: transparent; }
/* a scored option pill: "N label", the number set off in weight 500 with a small gap */
.pill-score b { font-weight: 500; margin-right: 3px; }

/* ---- preview ---- */
#preview-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#draft-chip { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--gray-bg); color: var(--text); font-weight: 500; }
#char-counter { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: auto; }
#char-counter.amber { color: var(--amber-text); font-weight: 500; }
#char-counter.red { color: var(--red-text); font-weight: 500; }
#char-warning { font-size: 11px; color: var(--red-text); padding: 6px 14px; background: var(--red-bg); border-bottom: 1px solid var(--border); }
#missing-badge { font-size: 11px; font-weight: 500; color: var(--red-text); background: var(--red-bg); border-radius: 4px; padding: 2px 9px; }
#polish-banner { font-size: 12px; color: var(--amber-text); background: var(--amber-bg); padding: 7px 14px; border-bottom: 1px solid var(--border); }
#polish-toggle.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#copy-btn { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 500; min-width: 150px; }
#copy-btn:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
#copy-btn.confirming { background: var(--sheet); color: var(--red-text); border-color: var(--red-border); }
#copy-btn.confirming:hover { background: var(--red-bg); }
#preview {
  flex: 1; overflow-y: auto; padding: 14px; max-width: 70ch;
  font-family: var(--serif);
  font-size: 13.5px; line-height: 1.8; color: var(--ink); white-space: pre-wrap; word-break: break-word;
}
#preview[contenteditable="true"] { background: #FDFBF2; }
#preview[contenteditable="true"]:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
.pv-line { cursor: pointer; border-radius: 3px; padding: 0 2px; margin: 0 -2px; }
.pv-line:hover { background: var(--tint); }
.pv-blank { background: var(--red-bg); color: var(--red-text); border-bottom: 1.5px solid var(--red-text); border-radius: 2px 2px 0 0; padding: 0 6px; font-weight: 500; }
.pv-blank:hover { background: var(--red-bg); border-radius: 3px; cursor: pointer; }
/* a default the medic has not stood behind yet: present, but plainly not attested */
.pv-proposed { color: var(--text-faint); font-style: italic; }
.pv-proposed[data-field] { border-bottom: 1px dotted var(--border-strong); cursor: pointer; }
.pv-proposed[data-field]:hover { background: var(--tint); }
.pv-focus { background: #EAE3D0; box-shadow: inset 0 -2px 0 var(--ink); border-radius: 2px; }
.pv-withheld { background: var(--amber-bg); border-radius: 2px; }

/* ---- modal ---- */
#modal-root {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-card { background: var(--sheet); border-radius: var(--radius); box-shadow: 0 20px 60px rgba(60,50,30,.25); width: 100%; max-width: 440px; padding: 20px; }
.modal-title { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
.modal-body { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.5; }
.modal-body p { margin: 0 0 6px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 500; }
.modal-btn.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.modal-btn.danger { background: var(--red-text); border-color: var(--red-text); color: #fff; font-weight: 500; }
.modal-btn.danger:hover { background: #8C2F22; }

/* ---- responsive ---- */
@media (max-width: 1099px) {
  #panes { grid-template-columns: minmax(0, 1fr); }
  #preview-pane { position: static; max-height: none; }
  .topbar-controls { margin-left: 0; width: 100%; }
}
@media (min-width: 1100px) { #panes { padding: 20px; gap: 20px; } }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">PCR Narrative Builder <span id="version-tag">Builder v1 · source v0.9 · NYS v26.1</span></div>
  <div class="topbar-controls">
    <label class="tb-field"><span class="tb-label">Unit</span>
      <select id="unit-select">
        <option value="35M1">35M1</option>
        <option value="35M2">35M2</option>
        <option value="35M3">35M3</option>
        <option value="__other__">other…</option>
      </select>
      <input id="unit-other" type="text" placeholder="unit" size="8" hidden>
    </label>
    <label class="tb-field"><span class="tb-label">Pt category</span>
      <select id="category-select"></select>
    </label>
    <div class="tb-field add-block-wrap">
      <button id="add-block" type="button">+ add assessment block</button>
      <div id="add-block-popup" hidden></div>
    </div>
    <div id="draft-switcher" hidden></div>
    <button id="reset-order" type="button" hidden>Reset order</button>
    <button id="new-call" type="button">New call</button>
  </div>
</header>

<div id="keyhint-bar">↵ accept · type to change · Tab skip · nothing is written until you accept it</div>

<main id="panes">
  <section id="form-pane">
    <div id="worksheet"></div>
  </section>

  <section id="preview-pane">
    <div id="preview-head">
      <span id="draft-chip" hidden></span>
      <span id="char-counter" title="emsCharts HPI cap: 4,000 characters">0</span>
      <span id="missing-badge" hidden>0 open</span>
      <button id="polish-toggle" type="button">Polish</button>
      <button id="copy-btn" type="button">Copy</button>
    </div>
    <div id="char-warning" hidden></div>
    <div id="polish-banner" hidden>editing — live sync paused</div>
    <div id="preview"></div>
  </section>
</main>

<footer id="statusbar"><span id="save-state">ready</span></footer>

/* -------------------------------------------------------------------------

   hospital datalist. DOC may override the hospital list.
   ------------------------------------------------------------------------- */
const UNIT_TOKEN = "35M___";
const OTHER = "__other__";
const BL0 = "\uE000", BL1 = "\uE001";           // blank sentinels (stripped from text)
const SS_KEY = "pcrb_state";
const W_MAP = { 4: "3.5em", 8: "6em", 16: "11em", 32: "18em", 64: "100%" };

  ageField: "sh_pt_age",
  molstBlocks: ["doa"],
  molstTemplates: ["cardiacArrest"],
  loiBlocks: ["cardiac", "metabolic"],
  // traumaMajor is excluded: it carries its own SMR line.
  traumaRelevantPrimary: ["traumaGeneral", "traumaMinor", "burns"],
  headToToePrimary: ["traumaGeneral", "traumaMajor", "traumaMinor", "burns"]

/* -------------------------------------------------------------------------
   A paragraph is named by a TOKEN, not a number. The shell is four fixed
   paragraphs — "p1".."p4" — and every stacked block or template is a paragraph
   of its OWN, named by its unit key ("owner:<id>") and printed between p3 and
   p4 in stack order (see paraOrder). Sentence order is unchanged — only the
   paragraph boundaries live here. Everything the assembler emits lands in a
   bucket; a token no longer in the order (a box that has since been removed)
   falls back to PARA_FALLBACK, and an empty bucket disappears rather than
   leaving a blank line.
   ------------------------------------------------------------------------- */
const PARA_SHELL = ["p1", "p2", "p3", "p4"];
const PARA_FALLBACK = "p3";
const PARA_SECTIONS = { sh_dispatch: "p1", sh_primary: "p1", sh_mental: "p1",
                        sh_secondary: "p3", sh_ongoing: "p4" };
/** sh_assessment is the one section that splits across paragraphs, at line level. */
const PARA_LINES = { sh_vitals_line: "p2", sh_impression_line: "p3" };
/**
 * The paragraph token DOC puts a line in: a named line, else a named shell section,
 * else the disposition, else — for a line a block or template owns — that box's own
 * paragraph. The single place block ownership is turned into a token, so the row stamp
 * at assemble time and homeParaOf() can never drift apart.
 * @param {string} sectionId @param {?string} lineId @returns {string} a paragraph token
 */
function paraOf(sectionId, lineId) {
  if (PARA_LINES[lineId]) return PARA_LINES[lineId];
  if (PARA_SECTIONS[sectionId]) return PARA_SECTIONS[sectionId];
  if (String(sectionId).indexOf("disp_") === 0) return "p4";
  const rec = lineId ? LINE_INDEX[lineId] : null;
  if (rec && (rec.ownerType === "block" || rec.ownerType === "template")) {
    return "owner:" + rec.ownerId;
  }
  return PARA_FALLBACK;
}

/* ============================ ORDERING ============================ */

/**
 * User-controlled order. The DEFAULT order is DOC's own — shell sections in
 * declaration order, the block slot at its anchor, the disposition last — and that
 * default is what an untouched draft renders, unchanged from before any of this
 * existed. A medic may rearrange it by dragging, and the arrangement is stored as
 * three small, additive facts on the draft:
 *
 *   topOrder       null until the first drag, then the whole top-level order. NULL,
 *                  not an empty array: an untouched draft has to keep following DOC
 *                  as DOC grows, and only the absence of a stored order says so.
 *   lineOrder      regionKey -> line keys, frozen one region at a time for the same
 *                  reason — a region nobody dragged inside still follows DOC.
 *   paraOverrides  unitKey -> paragraph token, stored only where it differs from home
 *                  paragraph, so a unit that is merely moved keeps answering to DOC.
 *
 * Three kinds of unit key are addressable:
 *   "line:<lineId>"    one sentence. A fork's option lines are NOT units of their own:
 *                      they ride with the fork line that owns them (see FORK_PARENT).
 *   "owner:<ownerId>"  one whole block/template box; every row inside moves with it.
 *   "sec:<sectionId>"  a fixed shell region, plus "sec:disposition". Sections are not
 *                      draggable, but they are entries in the top-level order because
 *                      lines are dropped relative to them.
 * A regionKey is a "sec:" or "owner:" key read as a container: where a line lives.
 *
 * Nothing here renders, and nothing here saves. Everything is a pure read of DOC plus
 * the draft, except applyMove() and resetOrder(), which mutate the draft and leave
 * both the redraw and the write to their caller.
 */
const TOP_REGION = "__top__";

/** lineId -> the outermost fork line it rides with. Filled by indexLines(). */
const FORK_PARENT = Object.create(null);

/**
 * Which region does a line belong to when nobody has moved it?
 * @param {string} lineId @returns {string|null} regionKey, or null for an unknown line
 */
function homeRegionOf(lineId) {
  const rec = LINE_INDEX[lineId];
  if (!rec) return null;
  if (rec.ownerType === "shell") return "sec:" + rec.ownerId;
  if (rec.ownerType === "disposition") return "sec:disposition";
  return "owner:" + rec.ownerId;
}

/**
 * The paragraph a unit lands in with nothing overriding it. A line answers from its
 * HOME section, so dragging a sentence somewhere else does not silently re-file it —
 * only an override does that. A box IS a paragraph, so its home token is its own key,
 * and a line the box owns answers with that same token.
 * "sec:" keys are an extension used by applyMove()'s neighbour scan: a section cannot
 * be dragged, but it is a legitimate neighbour to inherit a paragraph from.
 * @param {string} unitKey @returns {string} a paragraph token
 */
function homeParaOf(unitKey) {
  const key = String(unitKey);
  if (key.indexOf("line:") === 0) {
    const id = key.slice(5);
    const rec = LINE_INDEX[id];
    return rec ? paraOf(rec.sectionId, id) : PARA_FALLBACK;
  }
  if (key.indexOf("owner:") === 0) return key;
  // The disposition region has no single DOC section id — every disposition section is
  // "disp_<id>" — so ask paraOf() with the prefix that decides it.
  if (key === "sec:disposition") return paraOf("disp_", null);
  if (key.indexOf("sec:") === 0) return paraOf(key.slice(4), null);
  return PARA_FALLBACK;
}

/**
 * Every paragraph, in PRINT order: the three shell paragraphs that open the narrative,
 * then one paragraph per stacked box in the order the top-level arrangement holds them,
 * then the disposition. Dragging a box reorders the boxes among themselves; it cannot
 * lift one out from between p3 and p4, which is the frame the standard fixes.
 * @param {Object} ctx @returns {Array<string>} paragraph tokens
 */
function paraOrder(ctx) {
  const owners = [];
  effectiveTopOrder(ctx).forEach(function (key) {
    if (String(key).indexOf("owner:") === 0) owners.push(key);
  });
  return ["p1", "p2", "p3"].concat(owners, ["p4"]);
}

/**
 * Where a token prints. A token that is not in the order at all — a line override still
 * naming a box the medic has since removed — falls back to the assessment paragraph
 * rather than vanishing or landing at ¶0. Both the buckets and the badges read through
 * here, so a stale override reads the same in the narrative and on the worksheet.
 * @param {string} token @param {Array<string>} order @returns {number} index into order
 */
function paraIndexOf(token, order) {
  const at = order.indexOf(token);
  return at >= 0 ? at : order.indexOf(PARA_FALLBACK);
}

/**
 * The order DOC asks for: shell sections in declaration order, the stacked boxes in
 * add order at the slot anchor, the disposition last. This mirrors assemble()'s
 * traversal deliberately — that agreement is what makes a pristine draft render
 * byte-identically. Unlike assemble() it does not drop collapsed or DOA-N/A sections
 * and does not skip the disposition: this is the ORDER list, not the render filter,
 * and every section has to hold a place in it whether or not it emits anything today.
 * @param {Object} ctx @returns {Array<string>} unit keys
 */
function defaultTopOrder(ctx) {
  const out = [];
  const anchor = slotAnchorId();
  const owners = (ctx.blockIds || []).map(function (id) { return "owner:" + id; });
  let slotPlaced = false;
  ((DOC.shell && DOC.shell.sections) || []).forEach(function (s) {
    out.push("sec:" + s.id);
    if (s.id === anchor) { out.push.apply(out, owners); slotPlaced = true; }
  });
  if (!slotPlaced) out.push.apply(out, owners);
  out.push("sec:disposition");
  return out;
}

/**
 * Is this region still on the chart? A list stored against a box that was removed is
 * kept rather than deleted: adding the box back puts its lines where the medic had
 * them. Until then the region does not exist and its lines fall back to their homes.
 * @param {string} regionKey @param {Object} d draft @returns {boolean}
 */
function regionExists(regionKey, d) {
  const key = String(regionKey);
  if (key === "sec:disposition") return true;
  if (key.indexOf("owner:") === 0) return (d.blockIds || []).indexOf(key.slice(6)) >= 0;
  if (key.indexOf("sec:") === 0) {
    const id = key.slice(4);
    return ((DOC.shell && DOC.shell.sections) || []).some(function (s) { return s.id === id; });
  }
  return false;
}

/**
 * Where does each moved line actually live? One line key can survive in more than one
 * stored list, so the FIRST list to claim it wins and later copies are ignored — top
 * level first, then the region lists. Keys that can no longer be honoured are dropped
 * here once instead of at every call site: lines DOC no longer declares, fork option
 * lines (they ride with their fork, so they were never placeable), and every list
 * belonging to a region that is not currently on the chart.
 * @param {Object} d draft @returns {Map<string,string>} "line:<id>" -> regionKey | TOP_REGION
 */
function placementIndex(d) {
  const place = new Map();
  const claim = function (list, regionKey) {
    (list || []).forEach(function (key) {
      if (String(key).indexOf("line:") !== 0) return;
      const id = String(key).slice(5);
      if (!LINE_INDEX[id] || FORK_PARENT[id]) return;
      if (!place.has(key)) place.set(key, regionKey);
    });
  };
  claim(d.topOrder, TOP_REGION);
  const lists = d.lineOrder || {};
  Object.keys(lists).forEach(function (regionKey) {
    if (!regionExists(regionKey, d)) return;
    claim(lists[regionKey], regionKey);
  });
  return place;
}

/**
 * Fold DOC's defaults back into a stored order without disturbing the arrangement.
 * A default that is missing — a new section, a box just added to the stack, a line DOC
 * grew after this region was frozen — is inserted immediately after its nearest
 * PRECEDING default sibling that is already present, so it keeps the adjacency DOC
 * declared for it; with nothing of its own preceding it, it goes to the front. Walking
 * the defaults in order means several new neighbours stay in DOC's order among
 * themselves. A stored order of nothing therefore reproduces the defaults exactly.
 * @param {Array<string>} current @param {Array<string>} defaults @returns {Array<string>}
 */
function mergeDefaults(current, defaults) {
  const out = current.slice();
  let prev = null;
  (defaults || []).forEach(function (key) {
    if (out.indexOf(key) >= 0) { prev = key; return; }
    const at = prev === null ? -1 : out.indexOf(prev);
    out.splice(at + 1, 0, key);
    prev = key;
  });
  return out;
}

/** A stored top-level entry survives only while the thing it names is still there. */
function topEntryValid(key, ctx, defaults, place) {
  const k = String(key);
  if (k.indexOf("sec:") === 0) return defaults.indexOf(k) >= 0;
  if (k.indexOf("owner:") === 0) return (ctx.blockIds || []).indexOf(k.slice(6)) >= 0;
  if (k.indexOf("line:") === 0) return place.get(k) === TOP_REGION;
  return false;
}

/**
 * The top-level order in force right now: what the medic arranged, minus entries that
 * no longer hold, plus every default the arrangement predates. A pristine draft gets
 * defaultTopOrder() back untouched — the identity paragraphs() rests on.
 * @param {Object} ctx @returns {Array<string>} unit keys; every "sec:" key is present
 */
function effectiveTopOrder(ctx) {
  const d = ctx.d;
  const defaults = defaultTopOrder(ctx);
  if (!d.topOrder) return defaults;
  const place = placementIndex(d);
  const kept = [];
  d.topOrder.forEach(function (key) {
    if (kept.indexOf(key) >= 0) return;
    if (!topEntryValid(key, ctx, defaults, place)) return;
    kept.push(key);
  });
  return mergeDefaults(kept, defaults);
}

/**
 * The lines DOC puts in a region, in DOC's order — the same walk the worksheet and the
 * assembler make (ownerBox / ownerSections): a shell section's own top-level lines,
 * the ACTIVE disposition's lines, or a box's active sub-block lines followed by its
 * block-level lines. Forks are not recursed into, because a fork is one unit. The
 * disposition picker is not a sentence and never appears here.
 * @param {string} regionKey @param {Object} ctx @returns {Array<string>} line keys
 */
function regionDefaults(regionKey, ctx) {
  const key = String(regionKey);
  const keysOf = function (lines) {
    return (lines || []).map(function (l) { return "line:" + l.id; });
  };
  if (key === "sec:disposition") {
    const dsp = (DOC.dispositions || []).find(function (x) { return x.id === ctx.d.disposition; });
    return dsp ? keysOf(dsp.lines) : [];
  }
  if (key.indexOf("sec:") === 0) {
    const id = key.slice(4);
    const s = ((DOC.shell && DOC.shell.sections) || []).find(function (x) { return x.id === id; });
    return s ? keysOf(s.lines) : [];
  }
  if (key.indexOf("owner:") === 0) {
    const res = resolveOwner(key.slice(6));
    if (!res) return [];
    let out = [];
    (res.owner.subBlocks || []).forEach(function (sb) {
      if (subActive(res.owner, sb)) out = out.concat(keysOf(sb.lines));
    });
    return out.concat(keysOf(res.owner.lines));
  }
  return [];
}

/**
 * The lines living in a region right now, in order: the medic's arrangement for that
 * region — minus anything since claimed by another region or dropped out of DOC — with
 * DOC's own lines merged back in at the adjacency DOC declared for them.
 * Eligibility is deliberately NOT consulted here. This is the order list, not the
 * render filter: a line that emits nothing today still holds its place for the day it
 * does, and the renderers and the assembler keep their own eligibility rules.
 * @param {string} regionKey @param {Object} ctx
 * @param {Map} [place] a placement scan to share, when the caller already made one
 * @returns {Array<string>} line keys
 */
function regionUnits(regionKey, ctx, place) {
  const d = ctx.d;
  const pl = place || placementIndex(d);
  const stored = (d.lineOrder || {})[regionKey] || [];
  const kept = [];
  stored.forEach(function (key) {
    if (kept.indexOf(key) >= 0) return;
    if (pl.get(key) !== regionKey) return;
    kept.push(key);
  });
  // Defaults claimed by another region drop out entirely — they live there now, and
  // they cannot anchor anything here either. Ones already kept stay in, as anchors.
  const defaults = regionDefaults(regionKey, ctx).filter(function (key) {
    return kept.indexOf(key) >= 0 || !pl.has(key);
  });
  return mergeDefaults(kept, defaults);
}

/**
 * One integer per addressable unit, in the order the narrative reads: each top-level
 * entry, then — where that entry is a region — the lines inside it. A region takes an
 * ordinal of its own, which is what makes a box sortable as a box and what gives a line
 * dropped at the very top of a region a neighbour above it to inherit from.
 * @param {Object} ctx @returns {Map<string,number>} unitKey -> ordinal
 */
function globalUnitIndex(ctx) {
  const place = placementIndex(ctx.d);
  const map = new Map();
  let n = 0;
  effectiveTopOrder(ctx).forEach(function (key) {
    if (!map.has(key)) map.set(key, n++);
    if (String(key).indexOf("line:") === 0) return;      // a loose line has no region
    regionUnits(key, ctx, place).forEach(function (lineKey) {
      if (!map.has(lineKey)) map.set(lineKey, n++);
    });
  });
  return map;
}

/**
 * The paragraph a unit is in: its override, else its home. paragraphs() additionally
 * lets a box's override stand in for the lines the box owns; this answers for one unit.
 * @param {string} unitKey @param {Object} d draft @returns {string} a paragraph token
 */
function resolvedParaOf(unitKey, d) {
  const over = d && d.paraOverrides ? d.paraOverrides[unitKey] : null;
  return over || homeParaOf(unitKey);
}

/** Where a unit lives at this instant: the stored list that claims it, else its home. */
function currentRegionOf(unitKey, d) {
  if ((d.topOrder || []).indexOf(unitKey) >= 0) return TOP_REGION;
  const lists = d.lineOrder || {};
  const found = Object.keys(lists).find(function (rk) {
    return (lists[rk] || []).indexOf(unitKey) >= 0;
  });
  if (found) return found;
  if (String(unitKey).indexOf("line:") === 0) return homeRegionOf(String(unitKey).slice(5));
  return TOP_REGION;                                     // a box only ever lives up top
}

/** Freeze one region's current order onto the draft, unless it is frozen already. */
function materializeRegion(d, regionKey, ctx) {
  if (!regionKey || regionKey === TOP_REGION) return;
  if (!d.lineOrder) d.lineOrder = {};
  if (d.lineOrder[regionKey]) return;
  if (!regionExists(regionKey, d)) return;
  d.lineOrder[regionKey] = regionUnits(regionKey, ctx);
}

/**
 * With no paragraph asked for, a moved unit joins the one it landed against: the unit
 * immediately above it in the new order, or the one below when it landed at the very
 * top, or its own home when there is nothing else. Call this AFTER the move is
 * committed — it reads the arrangement the move just wrote.
 * A box is followed by its OWN lines, so the downward scan steps over them: the point
 * is which neighbour the box joined, and its own contents are not a neighbour.
 * @param {string} unitKey @param {Object} ctx @returns {string} a paragraph token
 */
function inheritedPara(unitKey, ctx) {
  const order = Array.from(globalUnitIndex(ctx).keys());
  const at = order.indexOf(unitKey);
  if (at < 0) return homeParaOf(unitKey);
  if (at > 0) return resolvedParaOf(order[at - 1], ctx.d);
  const own = String(unitKey).indexOf("owner:") === 0 ? regionUnits(unitKey, ctx) : [];
  for (let i = at + 1; i < order.length; i++) {
    if (own.indexOf(order[i]) < 0) return resolvedParaOf(order[i], ctx.d);
  }
  return homeParaOf(unitKey);
}

/**
 * Commit one drag. The caller decides where the unit landed; this records it and
 * nothing else — no redraw, no save — so the caller keeps control of both.
 *
 * @param {{unitKey:string, toRegion:string, toIndex:number, adoptPara:?string}} move
 *   unitKey    "line:<id>" or "owner:<id>". A box carries its whole region with it, so
 *              it has nowhere to go but among the top-level units.
 *   toRegion   a regionKey, or TOP_REGION ("__top__") for the top level.
 *   toIndex    an index into the destination list AFTER the unit has been taken out of
 *              wherever it was: 0 is first, the list's length is last. Stating it
 *              post-removal is what makes a move within one list unambiguous.
 *   adoptPara  the paragraph TOKEN the caller wants, or null to inherit from the
 *              neighbours. A line dropped into a box therefore adopts the box's own
 *              token, which is what keeps it in that block's paragraph.
 * @returns {boolean} whether anything moved
 */
function applyMove(move) {
  if (!move || !move.unitKey) return false;
  const key = String(move.unitKey);
  const isOwner = key.indexOf("owner:") === 0;
  const isLine = key.indexOf("line:") === 0;
  if (!isOwner && !isLine) return false;
  // A fork's option line has no place of its own to move to — it rides with its fork.
  if (isLine && FORK_PARENT[key.slice(5)]) return false;
  const ctx = context();
  const d = ctx.d;
  const to = move.toRegion || TOP_REGION;
  if (isOwner && to !== TOP_REGION) return false;
  if (to !== TOP_REGION && !regionExists(to, d)) return false;

  // Freeze first, and only what this move touches: an untouched list stays absent so
  // its region keeps following DOC, while the lists about to be rewritten have to be
  // snapshots of what the medic is looking at, taken BEFORE anything shifts.
  if (!d.topOrder) d.topOrder = effectiveTopOrder(ctx);
  materializeRegion(d, currentRegionOf(key, d), ctx);
  materializeRegion(d, to, ctx);

  // Out of everywhere, not just out of where we think it was: a stale duplicate left in
  // some other list would otherwise resurrect the unit at its old place.
  d.topOrder = d.topOrder.filter(function (x) { return x !== key; });
  Object.keys(d.lineOrder).forEach(function (rk) {
    d.lineOrder[rk] = (d.lineOrder[rk] || []).filter(function (x) { return x !== key; });
  });

  const list = to === TOP_REGION ? d.topOrder : d.lineOrder[to];
  let at = move.toIndex | 0;
  if (!(at >= 0)) at = 0;
  if (at > list.length) at = list.length;
  list.splice(at, 0, key);

  // A box IS a paragraph, so it has none to adopt: dragging one reorders the boxes
  // among themselves and nothing else. Without this it would inherit its NEIGHBOUR's
  // token, which — via rowPara's box branch — would empty its own paragraph into the
  // neighbour's and dissolve the box-per-paragraph rule on the first drag.
  if (isOwner) { delete d.paraOverrides[key]; return true; }

  const adopted = move.adoptPara != null ? move.adoptPara : inheritedPara(key, ctx);
  // Only a difference from DOC is worth storing; matching it again forgets the override.
  if (adopted === homeParaOf(key)) delete d.paraOverrides[key];
  else d.paraOverrides[key] = adopted;
  return true;
}

/** Back to DOC's order, wholesale. Mutation only — no redraw, no save. */
function resetOrder() {
  const d = draft();
  d.topOrder = null;
  d.lineOrder = {};
  d.paraOverrides = {};
}

/** @returns {boolean} has the medic arranged anything? (what a reset affordance asks) */
function orderCustomized() {
  const d = draft();
  if (d.topOrder) return true;
  if (Object.keys(d.lineOrder || {}).length) return true;
  return Object.keys(d.paraOverrides || {}).length > 0;
}

  return { total: total, pickedCount: pickedCount, allPicked: ids.length > 0 && pickedCount === ids.length };
}

/**
 * @returns {string} the computed total (+ suffix) once every component is picked;
 * an amber blank once SOME but not all components are picked (the line is already
 * "in play" and the copy gate must see the gap); "" when nothing is picked yet, so
 * an untouched line stays untouched. A sum is never `req` and never has a default.
 */
function renderSum(p, c) {
  const r = sumTotal(p, c.ctx.d);
  if (r.pickedCount === 0) return "";
  if (!r.allPicked) return blankSpan(c, p.id, p.hint, "total", "missing", "___");
  return String(r.total) + (p.suffix || "");
}

/* Orientation (A+Ox) is computed, not typed: one array of picked components drives
   both the count and the legend letters, so the two can never disagree. */
const AOX = [
  { k: "person", a: "P", t: "Person" },
  { k: "place", a: "P", t: "Place" },
  { k: "time", a: "T", t: "Time" },
  { k: "event", a: "E", t: "Event" }
];
/** @returns {Array} the picked AOX rows, always in canonical order (storage order is ignored) */
function aoxPicked(values, id) {
  const sel = values[id];
  const have = Array.isArray(sel) ? sel : [];
  return AOX.filter(function (x) { return have.indexOf(x.k) >= 0; });
}
/** Orientation has a STRUCTURAL proposal: all four components — offered in the
 *  worksheet only (the ×4 pill), never written into the prose unaccepted. */
const AOX_KEYS = AOX.map(function (x) { return x.k; });
function aoxText(rows) {
  return rows.length + " (" + rows.map(function (x) { return x.a; }).join(", ") + ")";
}
/** @returns {string} "N (X, Y, Z)", or an amber blank. The part sits bare in a literal
 *  run ("Pt A+Ox {aox}, …"), so an unpicked score must hold its place rather than
 *  leave the sentence malformed. */
function renderAox(p, c) {
  if (fieldHidden(c.line.id, p.aox, c.ctx.d)) return "";
  const picked = aoxPicked(c.ctx.d.values, p.aox);
  if (picked.length === 0) return blankSpan(c, p.aox, null, "orientation", "missing", "___");
  return aoxText(picked);
}

/** @returns {boolean} does any fill/choice under these parts hold a value? (group activation) */
function partsHaveValue(parts, values) {
  return (parts || []).some(function (p) {
    if (typeof p === "string") return false;
    if (p.f) return nonEmpty(values[p.f]);
    if (p.aox) return nonEmpty(values[p.aox]);
    if (p.c) return nonEmpty(values[p.id]) || nonEmpty(values[p.id + "__other"]);
    if (p.g) return partsHaveValue(p.g, values);
    return false;
  });
}

/** @param {string} [label] overrides the derived tail — for computed parts whose
 *  field id does not read as English (see renderAox).
 *  @param {string} [kind] always "missing" from a blank; "proposed" survives only as a
 *  LINE-level item (an unsettled tri or esc decision — see noteLineLevel) */
function noteMissing(c, fieldId, hint, label, kind) {
  const lineLabel = c.line.label || c.line.id;
  const fieldLabel = label || fieldTail(fieldId, c.line.id, hint);
  c.missing.push({
    lineId: c.line.id, fieldId: fieldId, sectionId: c.sectionId, sectionName: c.sectionName,
    lineLabel: lineLabel, fieldLabel: fieldLabel, kind: kind || "missing",
    label: lineLabel + " — " + fieldLabel
  });
}
/**
 * An open item that belongs to a LINE rather than to a blank in the text: a tri line
 * still proposing omit, an esc line still proposing not-fired, an unpicked disposition.
 * These emit no sentinel, so assemblyHtml must skip them when it walks pairs; and they
 * go straight to the outer list, since a tri line that omits emits no row to commit on.
 */
function noteLineLevel(missing, line, sectionId, sectionName, fieldId, fieldLabel, kind) {
  const lineLabel = line.label || line.id;
  missing.push({
    lineId: line.id, fieldId: fieldId, sectionId: sectionId, sectionName: sectionName,
    lineLabel: lineLabel, fieldLabel: fieldLabel, kind: kind, lineLevel: true,
    label: lineLabel + " — " + fieldLabel
  });
}
function fieldTail(fieldId, lineId, hint) {
  let t = fieldId;
  if (lineId && t.indexOf(lineId + "_") === 0) t = t.slice(lineId.length + 1);
  else { const bits = t.split("_"); t = bits.slice(Math.max(1, bits.length - 2)).join(" "); }
  t = replaceAllStr(t, "_", " ").trim();
  if (!t && hint) t = hint;
  return t || fieldId;
}

/**
 * Render one Line into zero or more output lines.
 * @returns {Array<{lineId:string, raw:string, withheld:boolean}>}
 */
function renderLine(line, ctx, sectionId, sectionName, missing) {
  const c = { ctx: ctx, line: line, sectionId: sectionId, sectionName: sectionName,
              missing: [], dropped: false };
  const commit = function (rows) {
    if (rows.length) missing.push.apply(missing, c.missing);
    return rows;
  };
  if (!lineEligible(line, ctx)) return [];
  if (lineHidden(line.id, ctx.d)) return [];
  // A twin already stated earlier in the narrative emits nothing AND asks nothing —
  // the gate sits above the tri/esc branches, whose open items go straight to the
  // outer `missing` and would otherwise leak past it.
  if (ctx.suppressed && ctx.suppressed[line.id]) return [];

  if (line.kind === "fork") {
    const chosen = forkSel(line.id);
    // An unpicked pathway is not yet part of the chart: it emits nothing and asks
    // nothing (omit by default). Its worksheet row still prompts "pick one".
    if (!chosen.length) return [];
    let rows = [];
    chosen.forEach(function (lab) {
      const o = (line.options || []).find(function (x) { return x.label === lab; });
      if (!o) return;
      (o.lines || []).forEach(function (sub) {
        rows = rows.concat(renderLine(sub, ctx, sectionId, sectionName, missing));
      });
    });
    return rows;
  }

  // Nothing is written until the medic accepts it: an untouched skeleton emits no
  // text and raises no open item, so it cannot reach the clipboard unnoticed.
  if (!lineAccepted(line, ctx.d)) return [];

  let raw = "", withheld = false, proposed = false;
  if (line.kind === "std") raw = renderParts(line.parts, c);
  else if (line.kind === "tri") {
    const m = triMode(line.id);
    if (m === "omit") {
      // Omit emits nothing, but an unattested omit is still an open decision.
      if (!triSettled(line.id)) {
        noteLineLevel(missing, line, sectionId, sectionName, "__tri__" + line.id, "omit", "proposed");
      }
      return [];
    }
    withheld = m === "withheld";
    raw = renderParts(m === "given" ? line.given : line.withheld, c);
  } else if (line.kind === "esc") {
    const fired = ctx.d.esc[line.id] === "fired";
    proposed = !escSettled(line.id);
    if (proposed) {
      noteLineLevel(missing, line, sectionId, sectionName, "__esc__" + line.id, "not fired", "proposed");
    }
    raw = renderParts(fired ? line.fired : line.normal, c);
  }
  if (stripSentinels(raw).trim() === "") return [];
  return commit([{ lineId: line.id, raw: raw, withheld: withheld, proposed: proposed,
                   para: paraOf(sectionId, line.id) }]);
}

/**
 * @returns {{id:string,name:string,lines:Array}|null} a rendered section, or null when empty
 * DOC's per-line joinPrev is subsumed: everything inside a paragraph now flows as one
 * run of sentences, so there is no longer a per-row join to flag.
 */
function renderSection(sectionId, sectionName, lines, ctx, missing) {
  let rows = [];
  (lines || []).forEach(function (l) {
    rows = rows.concat(renderLine(l, ctx, sectionId, sectionName, missing));
  });
  if (!rows.length) return null;
  return { id: sectionId, name: sectionName, lines: rows };
}

/** Which shell section does the block slot follow? */
function slotAnchorId() {
  const secs = (DOC.shell && DOC.shell.sections) || [];
  if (DOC.shell && DOC.shell.slotAfter) return DOC.shell.slotAfter;
  const byName = secs.find(function (s) { return /assessment/i.test(s.id) || /assessment/i.test(s.name || ""); });
  if (byName) return byName.id;
  return secs.length > 3 ? secs[3].id : (secs.length ? secs[secs.length - 1].id : null);
}

/**
 * Assemble the block slot: every stacked owner — block or template — in add order.
 * Fired escalation lines whose owning block is no longer stacked are carried in as
 * the first lines of the slot (see return summary: "fired line survives the swap").
 * Escalation only ever APPENDS, so this net now fires solely after a primary-category
 * swap dropped the owner that held the fired line.
 * @returns {Array<Object>} sections
 */
function assembleSlot(ctx, missing) {
  const d = ctx.d;
  let sections = [];
  ctx.owners.forEach(function (o) {
    sections = sections.concat(ownerSections(o.owner, o.kind, ctx, missing));
  });

  const activeOwners = ctx.blockIds;
  const orphanRows = [];
  Object.keys(d.esc).forEach(function (lineId) {
    if (d.esc[lineId] !== "fired") return;
    const rec = LINE_INDEX[lineId];
    if (!rec || activeOwners.indexOf(rec.ownerId) >= 0) return;
    const rows = renderLine(rec.line, ctx, rec.sectionId, rec.sectionName, missing);
    orphanRows.push.apply(orphanRows, rows);
  });
  if (orphanRows.length) {
    if (sections.length) sections[0].lines = orphanRows.concat(sections[0].lines);
    else sections.push({ id: "slot_esc", name: "Escalation", lines: orphanRows });
  }
  return sections;
}

/**
 * A block/template renders each active sub-block, then its own block-level lines.
 * Sub-blocks come first because a block that HAS sub-blocks keeps only its tail
 * material (the escalation line) at block level — see return summary.
 * An escalation addendum is just another stacked owner behind its host, so it comes
 * through here on its own — there is no combined host+addendum section.
 * @returns {Array<Object>} one section per sub-block plus one for the block itself
 */
function ownerSections(owner, kind, ctx, missing) {
  const out = [];
  (owner.subBlocks || []).forEach(function (sb) {
    if (!subActive(owner, sb)) return;
    const s = renderSection(kind + "_" + owner.id + "_" + sb.id, owner.name + " · " + sb.name,
      sb.lines, ctx, missing);
    if (s) out.push(s);
  });
  const own = renderSection(kind + "_" + owner.id, owner.name, owner.lines, ctx, missing);
  if (own) out.push(own);
  // Paragraph break between sub-blocks is the default; a block may declare
  // subBlockJoin:"line" to run everything together as one paragraph instead.
  if (owner.subBlockJoin === "line" && out.length > 1) {
    const merged = { id: kind + "_" + owner.id, name: owner.name, lines: [] };
    out.forEach(function (s) { merged.lines = merged.lines.concat(s.lines); });
    return [merged];
  }
  return out;
}
function subActive(owner, sb) {
  const sel = draft().subs[owner.id];
  if (!sel) return owner.subBlocks[0] === sb;   // default: first sub-block
  return sel.indexOf(sb.id) >= 0;
}

/**
 * THE traversal. Every consumer (preview HTML, copy text, char count, missing list,
 * click-to-jump) derives from this one structure so they can never disagree.
 * Runs TWICE per assemble() — see assemble() — so it must stay free of side effects
 * on anything but the `missing` list it builds.
 * @param {Object} ctx
 * @returns {{sections:Array<{id,name,lines:Array<{lineId,raw,withheld}>}>, missing:Array}}
 */
function assembleOnce(ctx) {
  const missing = [];
  const sections = [];
  const shellSecs = (DOC.shell && DOC.shell.sections) || [];
  const anchor = slotAnchorId();
  let slotPlaced = false;

  shellSecs.forEach(function (s) {
    const collapsed = hasBehavior(s, "cancelled-collapse") && ctx.collapse;
    const na = ctx.doaActive && hasBehavior(s, "doa-na") && ctx.d.naSections[s.id];
    if (!collapsed && !na) {
      const sec = renderSection(s.id, s.name, s.lines, ctx, missing);
      if (sec) sections.push(sec);
    }
    if (s.id === anchor) {
      assembleSlot(ctx, missing).forEach(function (x) { sections.push(x); });
      slotPlaced = true;
    }
  });
  if (!slotPlaced) assembleSlot(ctx, missing).forEach(function (x) { sections.push(x); });

  // DOA block replaces the disposition entirely (doc §14).
  if (!ctx.doaActive) {
    const dsp = (DOC.dispositions || []).find(function (x) { return x.id === ctx.d.disposition; });
    if (dsp) {
      const sec = renderSection("disp_" + dsp.id, dsp.name, dsp.lines, ctx, missing);
      if (sec) sections.push(sec);
    } else {
      // The disposition is never proposed — an unpicked one is an open blank.
      noteLineLevel(missing, DISPO_LINE, "disposition", "Disposition",
        "__dispo__", "disposition", "missing");
    }
  }
  return { sections: sections, missing: missing };
}

/**
 * THE assembler. Twin dedupe needs to know, before any open item is committed, which
 * sentence of a twin group PRINTS first — and print order is not assembly order once
 * the medic has dragged something. So the traversal runs twice: a dry pass to learn
 * what would emit and in what order, then the real one with the losers gated out.
 * The second pass is skipped entirely when nothing is suppressed, which is what keeps
 * a chart with no stacked twins byte-identical to the one-pass narrative.
 * @param {Object} ctx @returns {Object} the assembly, plus `suppressed` / `twinShown`
 */
function assemble(ctx) {
  ctx.suppressed = null;
  const dry = assembleOnce(ctx);
  const twins = twinSuppression(dry, ctx);
  let asm = dry;
  if (Object.keys(twins.skip).length) {
    ctx.suppressed = twins.skip;
    asm = assembleOnce(ctx);
  }
  ctx.suppressed = twins.skip;
  asm.suppressed = twins.skip;
  asm.twinShown = twins.shown;
  noteDuplicates(asm);
  return asm;
}

/**
 * Which twin sentences lose. Rows are put in ORDINAL order — the same ordinal-then-
 * assembly-order sort paragraphs() makes WITHIN a bucket, so a dragged block counts as
 * earlier when it reads earlier — and the first EMITTING line of each group keeps the
 * group. A line that emitted nothing produced no row and so never claims anything.
 *
 * Ordinal order is print order inside one paragraph, not across them: paragraphs are
 * dealt by token (see paraOrder), and a bucket can print ahead of a unit with a smaller
 * ordinal. It cannot bite today — every twin group's members are block- or
 * template-owned, so a group only ever spans box paragraphs, which print in ordinal
 * order anyway — and a medic who overrides one twin's line into an earlier paragraph
 * gets the ordinal winner rather than the printed-first one. Deliberate: the winner
 * should be the sentence whose PLACE in the chart the medic arranged, and the loser
 * cites its winner by box name, which stays true either way.
 *
 * Fork arms take part on their own: a sub-line's row carries its own lineId, and its
 * ordinal comes from the fork it rides in (FORK_PARENT), which is the unit that moves.
 * @param {Object} asm the dry assembly @param {Object} ctx
 * @returns {{skip:Object, shown:Object}} lineId -> {by, byOwner}; `shown` holds the
 *   ones that would have been skipped but for the medic's own show-anyway.
 */
function twinSuppression(asm, ctx) {
  const anyway = ctx.d.showAnyway || {};
  const index = globalUnitIndex(ctx);
  const rows = [];
  let carried = -1;
  (asm.sections || []).forEach(function (s) {
    s.lines.forEach(function (l) {
      const at = index.get("line:" + (FORK_PARENT[l.lineId] || l.lineId));
      if (at != null) carried = at;
      rows.push({ lineId: l.lineId, sort: at != null ? at : carried, seq: rows.length });
    });
  });
  rows.sort(function (a, b) { return (a.sort - b.sort) || (a.seq - b.seq); });

  const winner = Object.create(null);
  const skip = Object.create(null);
  const shown = Object.create(null);
  rows.forEach(function (r) {
    const g = TWIN_OF[r.lineId];
    if (!g) return;
    if (!winner[g]) { winner[g] = r.lineId; return; }
    if (winner[g] === r.lineId) return;            // one line, several rows
    const cite = { by: winner[g], byOwner: twinOwnerName(winner[g]) };
    if (anyway["line:" + r.lineId]) shown[r.lineId] = cite;
    else skip[r.lineId] = cite;
  });
  return { skip: skip, shown: shown };
}

/**
 * The safety net under twin dedupe: two sentences DOC never paired that nonetheless
 * came out word for word the same. Each repeat past the first raises a line-level open
 * item, so the count shows it and Copy asks once — a soft gate, never a suppression,
 * because an identical sentence can be a true second event.
 * @param {Object} asm mutated: repeats are appended to asm.missing
 */
function noteDuplicates(asm) {
  const seen = Object.create(null);
  const noted = Object.create(null);
  paragraphs(asm).forEach(function (rows) {
    rows.forEach(function (l) {
      const k = dupKey(l.raw);
      // A sentence still holding blanks is unfinished, not a repeat of another one.
      if (k === "" || k.indexOf("___") >= 0) return;
      if (!seen[k]) { seen[k] = true; return; }
      if (noted[l.lineId]) return;
      noted[l.lineId] = true;
      const rec = LINE_INDEX[l.lineId];
      noteLineLevel(asm.missing, (rec && rec.line) || { id: l.lineId, label: l.lineId },
        (rec && rec.sectionId) || "", (rec && rec.sectionName) || "",

    });
  });
