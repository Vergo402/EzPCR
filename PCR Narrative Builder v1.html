/** Two sentences are the same sentence when only spacing, case, or a full stop differ. */
function dupKey(raw) {
  const t = stripSentinels(String(raw)).replace(/\s+/g, " ").trim().toLowerCase();
  return t.replace(/\.+$/, "");
}
/** The disposition picker is a worksheet row like any other, so it needs a line shape. */
const DISPO_LINE = { id: "disposition", kind: "dispo", label: "Disposition" };

/**
 * Run one paragraph's rows together: sentences inside a paragraph flow with a single
 * space. Both text and HTML go through this so copy and preview can never disagree.
 * @param {Array} rows @param {function(Object):string} paint @returns {string}
 */
function joinRows(rows, paint) {
  let out = "";
  (rows || []).forEach(function (l) {
    const t = paint(l);
    if (t === "") return;
    out += (out === "" ? "" : " ") + t;
  });
  return out;
}

/**
 * Deal every emitted row into its paragraph, in the order the medic arranged.
 *
 * Rows arrive in assembly order and each names the line that produced it; the ordering
 * index (see ORDERING) says where that line's UNIT sits now. Sorting by that index —
 * stably, so several rows from one unit keep assembly order between them — is the whole
 * of what dragging a sentence does to the narrative.
 *
 * A PRISTINE draft is byte-identical to the old fixed order. With nothing stored,
 * effectiveTopOrder() is defaultTopOrder() and every region is DOC's own list, and
 * defaultTopOrder() mirrors assemble()'s traversal exactly (shell sections in DOC order,
 * the slot at its anchor, disposition last). Ordinals therefore only ever rise along
 * assembly order, and a stable sort cannot move anything.
 *
 * A row whose unit has no ordinal at all inherits the nearest preceding row that had
 * one, which holds assembleSlot()'s orphaned fired-escalation rows — their box is no
 * longer stacked, so it is in no order — exactly where they render.
 * @returns {Array<Array<Object>>} one bucket per paraOrder() token (empties included)
 */
function paragraphs(asm) {
  const d = draft();
  const ctx = context();
  const index = globalUnitIndex(ctx);
  const order = paraOrder(ctx);
  const overrides = d.paraOverrides || {};
  const rows = [];
  let carried = -1;                        // before any known row: sorts to the front
  (asm.sections || []).forEach(function (s) {
    s.lines.forEach(function (l) {
      const unitId = FORK_PARENT[l.lineId] || l.lineId;
      const at = index.get("line:" + unitId);
      if (at != null) carried = at;
      rows.push({ row: l, sort: at != null ? at : carried, seq: rows.length,
                  para: rowPara(unitId, l, overrides) });
    });
  });
  // ES2020's sort IS stable; the tiebreak is written out anyway because assembly order
  // is load-bearing here, not something to inherit from the engine's good behaviour.
  rows.sort(function (a, b) { return (a.sort - b.sort) || (a.seq - b.seq); });

  const buckets = order.map(function () { return []; });
  rows.forEach(function (r) { buckets[paraIndexOf(r.para, order)].push(r.row); });
  return buckets;
}
/**
 * Which paragraph does one row land in? The line's own override wins. Failing that, a
 * line that BELONGS to a box follows the box's override, so moving a box takes its
 * sentences with it. Failing that, the paragraph the row was stamped with at render
 * time — the row's own answer, not a re-derived one, so nothing can drift from it.
 * @param {string} unitId @param {Object} row @param {Object} overrides
 * @returns {string} a paragraph token, resolved against paraOrder() by the caller
 */
function rowPara(unitId, row, overrides) {
  const own = overrides["line:" + unitId];
  if (own) return own;
  const rec = LINE_INDEX[unitId];
  if (rec && (rec.ownerType === "block" || rec.ownerType === "template")) {
    const box = overrides["owner:" + rec.ownerId];
    if (box) return box;
  }
  return row.para || PARA_FALLBACK;
}

/**
 * Copy renders every flagged span — proposed as well as missing — as "___", so the
 * character count never counts text the medic has not stood behind. The copy gate
 * keeps both counts at zero, so in practice this is only ever the honest counter.
 * @returns {string} sentinel-free text
 */
function blankText(raw) {
  const parts = String(raw).split(BL0);
  let out = parts[0];
  for (let i = 1; i < parts.length; i++) {
    const j = parts[i].indexOf(BL1);
    out += "___" + (j < 0 ? parts[i] : parts[i].slice(j + 1));
  }
  return out;
}

/** @returns {string} the narrative exactly as it will be pasted (no sentinels) */
function assemblyText(asm) {
  return paragraphs(asm).map(function (rows) {
    return joinRows(rows, function (l) { return blankText(l.raw); });
  }).filter(function (t) { return t !== ""; }).join("\n\n");
}

/** @returns {string} preview HTML: one span per line, blanks and withheld marked */
function assemblyHtml(asm) {
  const missingByLine = {};
  (asm.missing || []).forEach(function (m) {
    if (m.lineLevel) return;                 // no sentinel pair belongs to these
    if (!missingByLine[m.lineId]) missingByLine[m.lineId] = [];
    missingByLine[m.lineId].push(m);
  });
  const blankCursor = {};
  return paragraphs(asm).map(function (rows) {
    return joinRows(rows, function (l) {
      const body = esc(l.raw).replace(/[\s\S]*?/g, function (match) {
        const i = blankCursor[l.lineId] || 0;
        blankCursor[l.lineId] = i + 1;
        const m = (missingByLine[l.lineId] || [])[i];
        const inner = match.slice(1, -1);
        let cls = m && m.kind === "proposed" ? "pv-proposed" : "pv-blank";
        if (m && ui.focusKey === fieldKey(m.lineId, m.fieldId)) cls += " pv-focus";
        return '<span class="' + cls + '"' + (m ? ' data-field="' + esc(m.fieldId) + '"' : "") +
          ">" + inner + "</span>";
      });
      return '<span class="pv-line' + (l.withheld ? " pv-withheld" : "") +
        (l.proposed ? " pv-proposed" : "") +
        '" data-line="' + esc(l.lineId) + '">' + body + "</span>";
    });
  }).filter(function (t) { return t !== ""; }).join("\n\n");
}

/** emsCharts counts a hard return as two characters. */
function charCount(text) {
  const nl = text.match(/\n/g);
  return text.length + (nl ? nl.length : 0);
}

/* ============================ FORM RENDERING ============================ */

/** The preview runs FIRST: the worksheet paints every field's state from the open
 *  items the assembler just produced, so the two views can never disagree. */
function renderAll() {
  renderTopbar();
  renderPreview();
  renderWorksheet();
  scheduleSave();
}

function renderTopbar() {
  const d = draft();
  const us = document.getElementById("unit-select");
  const uo = document.getElementById("unit-other");
  const known = Array.prototype.slice.call(us.options)
    .some(function (o) { return o.value === d.unit; });
  if (known) { us.value = d.unit; uo.hidden = true; }
  else { us.value = OTHER; uo.hidden = false; uo.value = d.unit; }

  const cs = document.getElementById("category-select");
  if (!cs.dataset.built) {
    cs.appendChild(new Option("— pick a category —", ""));
    const g1 = el("optgroup"); g1.label = "Dispatch categories";
    Object.keys(CATEGORY_INDEX).filter(function (name) { return CATEGORY_INDEX[name].type === "block"; })
      .sort(function (a, b) { return a.localeCompare(b); })
      .forEach(function (name) { g1.appendChild(new Option(name, name)); });
    const g2 = el("optgroup"); g2.label = "Direct templates";
    Object.keys(DOC.templates || {}).forEach(function (k) {
      const t = DOC.templates[k];
      if (t.addendumOnly) return;          // reachable only as an escalation addendum
      g2.appendChild(new Option(t.name, t.name));
    });
    cs.appendChild(g1); cs.appendChild(g2);
    cs.dataset.built = "1";
  }
  cs.value = d.category || "";

  const sw = document.getElementById("draft-switcher");
  sw.innerHTML = "";
  sw.hidden = state.drafts.length < 2;
  state.drafts.forEach(function (dr, i) {
    const b = el("button", "draft-tab" + (i === state.activeDraft ? " active" : ""), dr.label);
    b.type = "button";
    b.addEventListener("click", function () {
      state.activeDraft = i; ui.polishWarned = false; renderAll();
    });
    sw.appendChild(b);
  });

  const chip = document.getElementById("draft-chip");
  chip.hidden = state.drafts.length < 2;
  chip.textContent = d.label;
  document.getElementById("reset-order").hidden = !orderCustomized();
  paintCopyLabel();
}

/** A field is addressed by its line and its id — the same pair the assembler stamps
 *  on every open item, so worksheet state and copy gate can never disagree. */
function fieldKey(lineId, fieldId) { return lineId + "|" + fieldId; }

/** The last assembly's open items, by field key. Rebuilt with every preview. */
function buildOpenIndex(asm) {
  const idx = Object.create(null);
  ((asm && asm.missing) || []).forEach(function (m) {
    const k = fieldKey(m.lineId, m.fieldId);
    if (!idx[k]) idx[k] = m;
  });
  ui.open = idx;
}

/** Everything that decides which ROWS exist. A value edit that leaves this unchanged
 *  never rebuilds the worksheet, so a caret in a text blank survives typing. */
function condSignature(ctx) {
  return Object.keys(ctx.cond).map(function (k) { return ctx.cond[k] ? "1" : "0"; }).join("") +
    "|" + ctx.blockIds.join(",") + "|" + (ctx.d.disposition || "") +
    "|" + (ctx.collapse ? 1 : 0) + "|" + (ctx.doaActive ? 1 : 0) +
    // Twin dedupe turns on a VALUE edit, not a structural one, so the suppressed set
    // has to be part of the signature or a newly-dimmed sentence never repaints.
    "|" + Object.keys((lastAsm && lastAsm.suppressed) || {}).sort().join(",");
}

/** A cond/opt line stays folded into a "+ label" row until it is relevant or opened. */
function lineDeferred(line, ctx) {
  if (!line.cond && !line.opt) return false;
  if (ui.expanded[line.id]) return false;
  if (lineTouched(line, ctx.d)) return false;
  return line.cond ? !ctx.cond[line.cond] : true;
}

/**
 * The paragraph a unit's BADGE shows: its own override, else — for a line owned by a
 * block/template — its box's override, else its home. This is rowPara()'s own → box →
 * fallback shape, read for a unit that has no assembled row to fall back to; the
 * fallback here is homeParaOf() rather than an assembled row's stamped paragraph.
 * Not resolvedParaOf(): that answers for one unit only and deliberately skips the box
 * fallback (see its own docstring), which a line badge needs and an owner badge is
 * unaffected by (an "owner:" key has no box of its own to inherit from either way).
 * @param {string} unitKey @param {Object} d draft @returns {string} a paragraph token
 */
function unitBadgePara(unitKey, d) {
  const overrides = (d && d.paraOverrides) || {};
  const own = overrides[unitKey];
  if (own) return own;
  if (String(unitKey).indexOf("line:") === 0) {
    const rec = LINE_INDEX[unitKey.slice(5)];
    if (rec && (rec.ownerType === "block" || rec.ownerType === "template")) {
      const box = overrides["owner:" + rec.ownerId];
      if (box) return box;
    }
  }
  return homeParaOf(unitKey);
}

/** The drag handle every orderable unit gets: a real button (keyboard-reachable),
 *  hover/focus-revealed (see CSS), its dot grid drawn in CSS rather than an asset.
 *  No click behavior yet — piece 4 wires the drag itself. */
function makeHandle(label) {
  const b = el("button", "ws-handle");
  b.type = "button";
  b.setAttribute("aria-label", label);
  b.appendChild(el("span", "ws-dots"));
  return b;
}

/* ---- delete affordances ---- */

/** Field types a × can remove. A structural decision (tri mode, escalation, fork arm,
 *  disposition) is NOT one of them: hiding it would strand its line with no way to
 *  change the mode that still drives it. Deleting the whole sentence is that affordance. */
const DELETABLE_FIELD = { text: 1, pills: 1, chips: 1, aox: 1 };

/** The sentence's own ×, in the handle gutter: hides the line on both sides. */
function makeDeleteLine(lineId) {
  const b = el("button", "ws-del ws-del-line", "×");
  b.type = "button";
  b.title = "delete sentence";
  b.setAttribute("aria-label", "delete sentence");
  b.addEventListener("click", function (e) { e.stopPropagation(); deleteLine(lineId); });
  return b;
}
/** The field's ×, at the right edge of its row. */
function makeDeleteField(f) {
  const b = el("button", "ws-del ws-del-field", "×");
  b.type = "button";
  b.title = "delete field";
  b.setAttribute("aria-label", "delete field");
  b.addEventListener("click", function (e) { e.stopPropagation(); deleteField(f.line.id, f.id); });
  return b;
}
/** Deleting charted material asks first — the same confirmation removeBlock uses. */
function deleteLine(lineId) {
  const rec = LINE_INDEX[lineId];
  const drop = function () { setHidden("line:" + lineId, true); structuralEdit(); };
  if (!rec || !lineTouched(rec.line, draft())) { drop(); return; }
  openModal({
    title: "Delete sentence?",
    body: "This sentence has entered values. Deleting it drops them from the narrative.",
    actions: [{ label: "Cancel", cls: "quiet" }, { label: "Delete", cls: "danger", onClick: drop }]
  });
}
function deleteField(lineId, fieldId) {
  setHidden("field:" + fieldKey(lineId, fieldId), true);
  structuralEdit();
}

/** Every hidden unit under one section, as restore rows. `match` is asked about each
 *  hidden unit's LINE_INDEX record, so a section only ever offers back its own. */
function hiddenEntries(match) {
  const d = draft();
  const out = [];
  Object.keys(d.hidden || {}).forEach(function (key) {
    const isLine = key.indexOf("line:") === 0;
    const body = key.slice(key.indexOf(":") + 1);
    const cut = body.indexOf("|");
    const lineId = isLine ? body : body.slice(0, cut);
    const rec = LINE_INDEX[lineId];
    if (!rec || !match(rec)) return;
    const lineLabel = (rec.line && rec.line.label) || lineId;
    out.push({ key: key, label: isLine ? lineLabel
      : lineLabel + " — " + fieldTail(body.slice(cut + 1), lineId, null) });
  });
  return out;
}
function closeHiddenPops() {
  Array.prototype.forEach.call(document.querySelectorAll("#worksheet .ws-hidden-pop"),
    function (p) { p.hidden = true; });
}
/** "+ N hidden" in a section's tools, opening the list of what it can take back. */
function hiddenChip(sec, match) {
  const entries = hiddenEntries(match);
  if (!entries.length) return;
  const wrap = el("span", "ws-hidden-wrap");
  const chip = el("button", "ws-hidden-chip", "+ " + entries.length + " hidden");
  chip.type = "button";
  chip.title = "restore deleted material";
  const pop = el("div", "ws-hidden-pop");
  pop.hidden = true;
  pop.appendChild(el("div", "popup-head", "Restore"));
  entries.forEach(function (en) {
    const row = el("button", "popup-row", en.label);
    row.type = "button";
    row.addEventListener("click", function (e) {
      e.stopPropagation();
      setHidden(en.key, false);
      structuralEdit();
    });
    pop.appendChild(row);
  });
  chip.addEventListener("click", function (e) {
    e.stopPropagation();
    const willOpen = pop.hidden;
    closeHiddenPops();
    pop.hidden = !willOpen;
  });
  wrap.appendChild(chip);
  wrap.appendChild(pop);
  sec._tools.appendChild(wrap);
}

/** The "¶N" pill next to a unit: N is where the unit's paragraph PRINTS — its position
 *  in paraOrder(), which shifts as boxes are stacked — and the pill goes amber once the
 *  unit no longer answers to its home paragraph, so a dragged sentence or box reads as
 *  moved at a glance. */
function makeParaBadge(unitKey, ctx) {
  const token = unitBadgePara(unitKey, ctx.d);
  const cls = "ws-para" + (token !== homeParaOf(unitKey) ? " ws-para-moved" : "");
  return el("span", cls, "¶" + (paraIndexOf(token, paraOrder(ctx)) + 1));
}

/**
 * Wrap one draggable LINE unit: a handle in a left gutter, its rows — everything
 * lineRow produces for it, including a fork's own .ws-sub — in the body, and a
 * paragraph badge. Not used for boxes: a box's handle/badge live on its own
 * .ws-sec/.ws-sechead instead (see ownerBox). Only builds DOM; piece 4 wires the drag.
 * @param {Element} host @param {string} unitKey "line:<id>" @param {Object} ctx
 * @param {string} [extraClass] e.g. "ws-loose" for a unit rendered with no section box
 * @returns {Element} the body node — render the unit's rows into this
 */
function unitWrap(host, unitKey, ctx, extraClass) {
  const wrap = el("div", "ws-line" + (extraClass ? " " + extraClass : ""));
  wrap.dataset.unit = unitKey;
  wrap.appendChild(makeHandle("Reorder sentence"));
  wrap.appendChild(makeDeleteLine(unitKey.slice(5)));
  const body = el("div", "ws-line-body");
  wrap.appendChild(body);
  wrap.appendChild(makeParaBadge(unitKey, ctx));
  host.appendChild(wrap);
  return body;
}

/**
 * Render one LINE unit whole: its wrap, its rows, and the twin-dedupe chip when the
 * assembler had something to say about it. Deliberately unguarded — the callers
 * differ on whether a hidden line reaches them, so each keeps its own check.
 * @param {Element} host @param {string} unitKey "line:<id>" @param {Object} ctx
 * @param {string} [extraClass]
 */
function renderUnit(host, unitKey, ctx, extraClass) {
  const rec = LINE_INDEX[unitKey.slice(5)];
  if (!rec) return;
  const body = unitWrap(host, unitKey, ctx, extraClass);
  lineRow(body, rec.line, ctx);
  twinChip(body, rec.line.id, ctx);
}

/**
 * A twin the assembler skipped is DIMMED on the worksheet, never removed: the medic
 * can still read and edit every field, and the chip says where the sentence was
 * already stated and offers to state it twice anyway. Pressing it again takes it back
 * out. Nothing here suppresses a row — that decision belongs to the assembler alone.
 * @param {Element} body the unit's .ws-line-body @param {string} lineId @param {Object} ctx
 */
function twinChip(body, lineId, ctx) {
  const asm = lastAsm || {};
  const cite = (asm.suppressed || {})[lineId] || (asm.twinShown || {})[lineId];
  if (!cite) return;
  const on = !!(ctx.d.showAnyway || {})["line:" + lineId];
  const row = body.children[0];
  if (!row) return;
  if (!on) body.parentNode.classList.add("ws-suppressed");
  const chip = el("button", "ws-hidden-chip ws-twin-chip", on ? "shown twice · hide"
    : "already stated in " + (cite.byOwner || "an earlier sentence") + " · show anyway");
  chip.type = "button";
  chip.title = on ? "state this once only" : "state this a second time anyway";
  chip.addEventListener("click", function (e) {
    e.stopPropagation();
    const d = draft();
    const m = d.showAnyway || (d.showAnyway = {});
    if (on) delete m["line:" + lineId]; else m["line:" + lineId] = true;
    structuralEdit();
  });
  row.appendChild(chip);
}

/**
 * Walk the medic's arranged order top to bottom: a fixed shell section, the ONE owner
 * box a "owner:" entry names, the disposition section, or a line dragged all the way to
 * the top level with no section of its own. A pristine draft's effectiveTopOrder() is
 * defaultTopOrder(), which mirrors this exactly (see ORDERING), so this reproduces the
 * old fixed walk (shell sections → slot at anchor → disposition) byte-for-byte.
 */
function renderWorksheet() {
  if (ui.dragging) return;      // a rebuild mid-drag would destroy the dragged node
  const ctx = context();
  const ws = document.getElementById("worksheet");
  const hadFocus = ws.contains(document.activeElement);
  const caret = textCaret(document.activeElement);
  ws.innerHTML = "";
  const ownerByKey = Object.create(null);
  ctx.owners.forEach(function (o) { ownerByKey["owner:" + o.owner.id] = o; });
  effectiveTopOrder(ctx).forEach(function (key) {
    if (key === "sec:disposition") {
      if (!ctx.doaActive) dispositionSection(ws, ctx);
    } else if (key.indexOf("sec:") === 0) {
      const s = ((DOC.shell && DOC.shell.sections) || [])
        .find(function (x) { return x.id === key.slice(4); });
      if (s) shellSection(ws, s, ctx);
    } else if (key.indexOf("owner:") === 0) {
      const o = ownerByKey[key];
      if (o) ownerBox(ws, o, ctx);
    } else if (key.indexOf("line:") === 0) {
      const rec = LINE_INDEX[key.slice(5)];
      if (rec && !lineHidden(rec.line.id, ctx.d)) renderUnit(ws, key, ctx, "ws-loose");
    }
  });
  ui.condSig = condSignature(ctx);
  settleFocus();
  if (hadFocus) restoreWorksheetFocus(caret);
}

function sectionNode(host, id, name) {
  const sec = el("div", "ws-sec");
  sec.dataset.section = id;
  const head = el("div", "ws-sechead");
  head.appendChild(el("h2", "ws-secname", name));
  const tools = el("span", "ws-sectools");
  head.appendChild(tools);
  const rows = el("div", "ws-rows");
  sec.appendChild(head); sec.appendChild(rows);
  host.appendChild(sec);
  sec._rows = rows; sec._tools = tools;
  return sec;
}

function shellSection(host, s, ctx) {
  const d = ctx.d;
  const sec = sectionNode(host, s.id, s.name);
  hiddenChip(sec, function (rec) { return rec.ownerType === "shell" && rec.sectionId === s.id; });
  if (hasBehavior(s, "cancelled-collapse") && ctx.collapse) {
    const lbl = el("label", "pt-contact");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!d.ptContactMade;
    cb.addEventListener("change", function () { d.ptContactMade = cb.checked; structuralEdit(); });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(" pt contact made"));
    sec._rows.appendChild(lbl);
    return;
  }
  if (ctx.doaActive && hasBehavior(s, "doa-na")) {
    const btn = el("button", "na-toggle" + (d.naSections[s.id] ? " on" : ""), "N/A");
    btn.type = "button";
    btn.addEventListener("click", function () {
      if (d.naSections[s.id]) delete d.naSections[s.id]; else d.naSections[s.id] = true;
      structuralEdit();
    });
    sec._tools.appendChild(btn);
    if (d.naSections[s.id]) { sec.classList.add("ws-na"); sec._rows.inert = true; }
  }
  if (s.note) sec._rows.appendChild(el("div", "ws-note", s.note));
  regionUnits("sec:" + s.id, ctx).forEach(function (key) {
    const rec = LINE_INDEX[key.slice(5)];
    if (rec && !lineHidden(rec.line.id, ctx.d)) renderUnit(sec._rows, key, ctx);
  });
}

/** lineId -> the sub-block that declares it, for one owner. Lets the box's line loop
 *  know when to open a new .ws-subhead without re-scanning subBlocks per line. */
function subBlockMap(owner) {
  const map = Object.create(null);
  (owner.subBlocks || []).forEach(function (sb) {
    (sb.lines || []).forEach(function (l) { map[l.id] = sb; });
  });
  return map;
}

/**
 * One box for a single stacked owner (block or template): chrome (remove ×, intro
 * note, sub-block pill row, handoff button) plus its lines in the medic's current
 * order. The box is itself a draggable top-level unit — data-unit/handle/badge live
 * on its .ws-sec/.ws-sechead, not inside a .ws-line (see unitWrap).
 */
function ownerBox(host, ownerRec, ctx) {
  const owner = ownerRec.owner, kind = ownerRec.kind;
  const unitKey = "owner:" + owner.id;
  const sec = sectionNode(host, kind + "_" + owner.id, owner.name);
  sec.dataset.unit = unitKey;
  const head = sec.querySelector(".ws-sechead");
  head.insertBefore(makeHandle("Reorder block"), head.firstChild);
  hiddenChip(sec, function (rec) {
    return rec.ownerId === owner.id && (rec.ownerType === "block" || rec.ownerType === "template");
  });
  sec._tools.appendChild(makeParaBadge(unitKey, ctx));
  const x = el("button", "rm-block", "×");
  x.type = "button"; x.title = "remove " + kind;
  x.addEventListener("click", function () { removeBlock(owner.id); });
  sec._tools.appendChild(x);
  if (owner.intro) sec._rows.appendChild(el("div", "ws-note", owner.intro));
  if (owner.subBlocks && owner.subBlocks.length) {
    const row = el("div", "sub-row");
    const multi = owner.subBlocks.some(function (sb) { return sb.multi; });
    owner.subBlocks.forEach(function (sb) {
      const b = el("button", "sub-pill" + (subActive(owner, sb) ? " on" : ""), sb.name);
      b.type = "button";
      b.addEventListener("click", function () { toggleSub(owner, sb, multi); });
      row.appendChild(b);
    });
    sec._rows.appendChild(row);
  }
  // A subhead marks entry into a sub-block's run of lines and dedups across
  // consecutive lines from the same one; owner.lines and any foreign line dragged
  // in here have no sub-block, so they never open one (matches the old fixed walk).
  const sbOf = subBlockMap(owner);
  let prevSb;
  regionUnits(unitKey, ctx).forEach(function (key) {
    const id = key.slice(5);
    const rec = LINE_INDEX[id];
    if (!rec) return;
    if (lineHidden(id, ctx.d)) return;
    const sb = sbOf[id] || null;
    if (sb !== prevSb) {
      if (sb) sec._rows.appendChild(el("div", "ws-subhead", sb.name));
      prevSb = sb;
    }
    renderUnit(sec._rows, key, ctx);
  });
  if (owner.handoff) maybeHandoffButton(sec._rows, owner, ctx);
}

function dispositionSection(host, ctx) {
  const sec = sectionNode(host, "disposition", "Disposition");
  hiddenChip(sec, function (rec) { return rec.ownerType === "disposition"; });
  lineRow(sec._rows, DISPO_LINE, ctx);
  regionUnits("sec:disposition", ctx).forEach(function (key) {
    const rec = LINE_INDEX[key.slice(5)];
    if (rec && !lineHidden(rec.line.id, ctx.d)) renderUnit(sec._rows, key, ctx);
  });
}

/* ---- rows and fields ---- */

/** A line with nothing to answer still asserts something in the narrative ("Obvious death
 *  criteria reviewed: not met."), so the worksheet shows it read-only rather than letting
 *  it emit unseen. Such a line is all literals, so joining them reproduces it exactly. */
function literalRow(host, line, ctx) {
  const row = el("div", "ws-row ws-literal");
  row.dataset.line = line.id;
  row.appendChild(el("span", "ws-label", wrapLabel(line.label || line.id)));
  row.appendChild(el("span", "ws-litval", (line.parts || [])
    .filter(function (p) { return typeof p === "string"; })
    .map(function (p) { return replaceAllStr(p, UNIT_TOKEN, ctx.unit); }).join("")));
  host.appendChild(row);
}

/** A slash-joined label ("Airway/breathing/pulse/skin") is one unbreakable word to the
 *  layout engine. A zero-width space after each "/" gives it legal break points, so a
 *  label that outruns its row never has to split a word down the middle. */
function wrapLabel(s) { return replaceAllStr(String(s), "/", "/\u200B"); }

/** One row per FIELD. The field's own label carries the row, so the line label only
 *  surfaces where there is no field to name it: a deferred line, or a literal one. */
function lineRow(host, line, ctx) {
  if (lineDeferred(line, ctx)) {
    const row = el("div", "ws-row ws-deferred");
    row.dataset.line = line.id;
    row.appendChild(el("span", "ws-label", wrapLabel(line.label || line.id)));
    row.appendChild(fieldNode({ line: line, id: "__open__", type: "open" }, ctx));
    host.appendChild(row);
    return;
  }
  const fields = lineFields(line, ctx);
  if (!fields.length) literalRow(host, line, ctx);
  fields.filter(function (f) { return !rowHidden(line, f, ctx.d); }).forEach(function (f, i) {
    const row = el("div", "ws-row ws-k-" + line.kind + (f.depth ? " ws-sub-" + f.depth : ""));
    row.dataset.line = line.id;
    row.appendChild(f.type === "sum" ? sumFieldNode(f, ctx) : fieldNode(f, ctx));
    if (DELETABLE_FIELD[f.type]) row.appendChild(makeDeleteField(f));
    // the line's note belongs to the line, so it rides its first field only
    if (i === 0 && line.note) row.appendChild(el("span", "ws-rownote", line.note));
    host.appendChild(row);
  });
  if (line.kind === "fork") {
    const sub = el("div", "ws-sub");
    forkSel(line.id).forEach(function (lab) {
      const o = (line.options || []).find(function (x) { return x.label === lab; });
      if (!o) return;
      (o.lines || []).forEach(function (s) { if (!lineHidden(s.id, ctx.d)) lineRow(sub, s, ctx); });
    });
    if (sub.children.length) host.appendChild(sub);
  }
}

/**
 * The focusable fields of one line, in reading order. A structural decision — tri
 * mode, escalation, fork branch, disposition — is a field like any other.
 *
 * Every entry carries a `depth`, which is what the worksheet indents on: the line's
 * FIRST field carries the sentence (depth 0), everything else in the line reads as a
 * continuation of it (depth 1), and a blank that only exists because an option was
 * picked hangs off that option (depth 2).
 *
 * A sum has no reading-order home of its own: the DOC lists it BEFORE its
 * components (so the sentence can say "GCS 13 (E3 V4 M6)"), but the worksheet
 * tabs through it AFTER them (E, V, M, then total) — reorderSums fixes that up
 * once the raw walk is done. `depth` marks every field after a line's first as
 * a sub-row (component pills, and the sum row that reads with them).
 * @returns {Array<{line:Object, id:string, type:string, depth:number, p:Object=}>}
 */
function lineFields(line, ctx) {
  const out = [];
  if (line.kind === "tri") {
    out.push({ line: line, id: "__tri__" + line.id, type: "tri", depth: 0 });
    const m = triMode(line.id);
    if (m !== "omit") partFields(m === "given" ? line.given : line.withheld, line, ctx, out, 0);
  } else if (line.kind === "esc") {
    out.push({ line: line, id: "__esc__" + line.id, type: "esc", depth: 0 });
    partFields(ctx.d.esc[line.id] === "fired" ? line.fired : line.normal, line, ctx, out, 0);
  } else if (line.kind === "fork") {
    out.push({ line: line, id: "__fork__" + line.id, type: "fork", depth: 0 });
  } else if (line.kind === "dispo") {
    out.push({ line: line, id: "__dispo__", type: "dispo", depth: 0 });
  } else {
    partFields(line.parts, line, ctx, out, 0);
  }
  const ordered = reorderSums(out);
  ordered.forEach(function (f, i) { f.depth = i === 0 ? 0 : Math.max(1, f.depth || 1); });
  return ordered;
}
/** Move each sum entry to just after the last of its listed component ids. */
function reorderSums(out) {
  const sums = [], rest = [];
  out.forEach(function (f) { (f.type === "sum" ? sums : rest).push(f); });
  if (!sums.length) return rest;
  sums.forEach(function (s) {
    const ids = s.p.sum || [];
    let idx = -1;
    rest.forEach(function (g, j) { if (ids.indexOf(g.id) >= 0) idx = j; });
    rest.splice(idx + 1, 0, s);
  });
  return rest;
}
/** @param {number} [depth] the floor for these parts: 0 at line level, 2 inside a
 *  picked option's own parts. The first field of the whole line always lands at 0. */
function partFields(parts, line, ctx, out, depth) {
  const base = depth || 0;
  const push = function (f) {
    f.depth = out.length ? Math.max(base, 1) : base;
    out.push(f);
  };
  (parts || []).forEach(function (p) {
    if (typeof p === "string") return;
    if (p.f) { push({ line: line, id: p.f, type: "text", p: p }); return; }
    if (p.c) {
      push({ line: line, id: p.id, type: p.multi ? "chips" : "pills", p: p });
      const sel = ctx.d.values[p.id];
      const picked = p.multi ? (Array.isArray(sel) ? sel : []) : (nonEmpty(sel) ? [sel] : []);
      if (picked.indexOf(OTHER) >= 0) {
        push({ line: line, id: p.id + "__other", type: "text",
               p: { f: p.id + "__other", hint: "other…", w: 16 } });

      return;
    }
    if (p.sum) { push({ line: line, id: p.id, type: "sum", p: p }); return; }
    if (p.aox) { push({ line: line, id: p.aox, type: "aox", p: p }); return; }
    if (p.g) { partFields(p.g, line, ctx, out, base); return; }

/** A row disappears when its own field is deleted — and an "other…" blank goes with
 *  the choice it belongs to, which is the only thing that puts it on the sheet. */
function rowHidden(line, f, d) {
  if (fieldHidden(line.id, f.id, d)) return true;
  const id = String(f.id);
  const cut = id.length - 7;                       // "__other".length
  if (cut > 0 && id.slice(cut) === "__other") return fieldHidden(line.id, id.slice(0, cut), d);
  return false;
}

function fieldLabel(f) {
  if (f.type === "open") return "";              // its row already shows the line label
  if (f.type === "aox") return "AOx";
  if (f.type === "sum") return "total";           // a computed field id doesn't read as English
  if (f.type === "text" || f.type === "pills" || f.type === "chips") {
    return fieldTail(f.id, f.line.id, f.p && f.p.hint);
  }

}

  if (f.type === "esc") return escSettled(f.line.id);
  if (f.type === "fork") return forkSel(f.line.id).length > 0;
  if (f.type === "dispo") return !!d.disposition;

}
/** Does a signed-off proposal stand behind this field, waiting for Enter? */

  }

}
/**
 * CONFIRMED / PROPOSED / AMBER. Open items still decide amber, but a proposal is no

 * to answer for. An untouched field with a default therefore paints FAINT (its

function fieldState(f) {

  const e = fieldEntry(f);

function choiceSummary(p, labs, d) {
  return oxford(labs.map(function (lab) {
    if (lab === OTHER) {
      const t = d.values[p.id + "__other"];
      return nonEmpty(t) ? String(t) : "other…";
    }
    if (p.score) {

function fieldValueText(f) {

  }
  if (f.type === "esc") return d.esc[f.line.id] === "fired" ? "FIRED" : "not fired";

  if (f.type === "fork") { const s = forkSel(f.line.id); return s.length ? s.join(", ") : "pick one"; }

  if (f.type === "aox") {

  if (f.type === "text") {

function fieldNode(f, ctx) {

}
/** A sum row is read-only and computed: no "ws-field" class (so roving focus,

 *  never deletable), no editor, just its label, the computed value in the mono

function sumFieldNode(f, ctx) {

  n.dataset.line = f.line.id;
  n.dataset.ftype = "sum";
  const txt = fieldValueText(f);
  n.appendChild(el("span", "ws-flabel", wrapLabel(fieldLabel(f)) + ":"));
  n.appendChild(el("span", "ws-fval ws-sumval" + (txt === "—" ? " ws-sumval-empty" : ""), txt));
  n.appendChild(el("span", "ws-keyhint ws-sumauto", "auto"));

}
function fieldSummary(n, f, st) {
  const lab = fieldLabel(f);

  n.appendChild(el("span", "ws-fval" + fieldTone(f), fieldValueText(f)));

/** A settled structural decision keeps its clinical colour in the summary: a fired

function fieldTone(f) {
  if (f.type === "esc") return draft().esc[f.line.id] === "fired" ? " tone-fired" : "";
  if (f.type === "tri" && triSettled(f.line.id)) {
    const m = triMode(f.line.id);
    return m === "given" ? " tone-given" : m === "withheld" ? " tone-withheld" : "";
  }

}
/** The cursor's field shows its real control plus the key legend. */
function fieldEditor(n, f, ctx) {
  n.classList.add("ws-editing");
  const lab = fieldLabel(f);
  if (lab) n.appendChild(el("span", "ws-flabel", wrapLabel(lab) + ":"));
  const box = el("span", "ws-ctl");
  n.appendChild(box);
  if (f.type === "text") textControl(n, box, f);
  else if (f.type === "aox") aoxControl(n, box, f, ctx);
  else if (f.type === "tri") triControl(n, box, f, ctx);
  else if (f.type === "esc") escControl(n, box, f, ctx);
  else if (f.type === "fork") forkControl(n, box, f, ctx);
  else if (f.type === "dispo") dispoControl(n, box, f, ctx);
  else if (f.type === "open") openControl(n, box, f);
  else choiceControl(n, box, f, ctx);

}

function withheldWord(line) {
  const first = (line.withheld || [])[0];
  if (typeof first === "string" && /not indicated/i.test(first)) return "not indicated";
  return "withheld";
}

function cssEsc(s) { return String(s).replace(/["\\]/g, "\\$&"); }

/* ---- roving focus ---- */

function fieldNodes() {
  return Array.prototype.slice.call(document.querySelectorAll("#worksheet .ws-field"));
}
function isUnresolved(n) {
  return n.classList.contains("ws-amber") || n.classList.contains("ws-proposed");
}
function nodeForKey(key) {
  if (!key) return null;
  return document.querySelector('#worksheet .ws-field[data-key="' + cssEsc(key) + '"]');
}
function textCaret(node) {

    if (node && node.tagName === "INPUT" && node.selectionStart != null) return node.selectionStart;
  } catch (err) { /* some input types throw on selectionStart */ }
  return null;
}
/** Rebuild one .ws-field in place (summary ↔ editor) and mark its row. */
function repaintField(key) {
  const old = nodeForKey(key);
  if (!old) return null;
  const fresh = fieldNode(old._f, context());
  old.parentNode.replaceChild(fresh, old);
  const row = fresh.closest(".ws-row");
  if (row) row.classList.toggle("ws-focused", ui.focusKey === key);
  return fresh;
}
/** Move the cursor. Repaints only the two affected fields — a focus move must never

function focusFieldNode(n, scroll) {

  const live = repaintField(ui.focusKey) || n;

  const target = inner || n;

  pv.querySelectorAll(".pv-focus").forEach(function (n) { n.classList.remove("pv-focus"); });
  if (!ui.focusKey) return;

  const line = pv.querySelector('.pv-line[data-line="' + cssEsc(ui.focusKey.slice(0, cut)) + '"]');

 *  whose live control owns its value (and, in a text blank, the caret). */
function paintOpenStates() {

    if (n.dataset.key === ui.focusKey) return;
    const f = n._f;
    const st = fieldState(f);
    n.className = "ws-field ws-" + st;
    n.innerHTML = "";

/* ---- controls ---- */

/** No hint is ever clipped: a blank is at least as wide as the placeholder it carries. */
function hintChars(hint) { return String(hint || "").length + 2; }
function fitWidth(base, hint) {
  return "min(100%, max(" + base + ", " + hintChars(hint) + "ch))";
}

function textControl(n, box, f) {
  const p = f.p || { f: f.id };
  const def = defaultFor(f.id, draft());
  const input = document.createElement("input");
  input.type = "text";
  input.dataset.field = f.id;
  input.dataset.line = f.line.id;
  input.tabIndex = 0;
  // The cursor must show what ENTER would accept, so a proposal outranks the hint as
  // placeholder text and the hint falls back to the tooltip.
  const ph = def != null ? String(def) : (p.hint || "");
  if (ph) input.placeholder = ph;
  if (def != null) input.classList.add("proposal");
  if (p.hint || ph) input.title = p.hint || ph;
  const v = val(f.id);
  input.value = nonEmpty(v) ? String(v) : "";
  const isHosp = p.w === "hospital";
  if (isHosp) {
    const listId = "dl_" + f.id;
    input.setAttribute("list", listId);
    const dl = document.createElement("datalist");
    dl.id = listId;
    HOSPITALS.forEach(function (h) { dl.appendChild(new Option(h, h)); });
    box.appendChild(dl);
  }
  input.style.width = fitWidth(isHosp ? W_MAP[16] : (W_MAP[p.w] || W_MAP[8]),
    hintChars(p.hint) > hintChars(ph) ? p.hint : ph);   // room for whichever runs longer

  });

}

/**
 * The one option-row builder: roving tabindex + aria-checked over radios (single) or
 * checkboxes (multi). The highlight opens on the current pick, else on the proposal.
 * A scored option (`sv` set) renders as "<b>N</b> label" instead of plain text.
 * @param {Array<{v:string,t:string,on:boolean,prop:boolean=,sv:number=}>} list

function optionRow(n, box, list, multi, pick) {
  const grp = el("span", "ws-opts");
  grp.setAttribute("role", multi ? "group" : "radiogroup");
  list.forEach(function (o) {
    const b = el("button", (multi ? "chip" : "pill") + (o.on ? " on" : "") +
      (o.prop && !o.on ? " prop" : "") + (o.sv != null ? " pill-score" : ""));
    if (o.sv != null) {

function setHighlight(n, i) {

  i = (i % btns.length + btns.length) % btns.length;
  Array.prototype.forEach.call(btns, function (b, j) {
    b.tabIndex = j === i ? 0 : -1;

}
function highlighted(n) {

}

function choiceControl(n, box, f, ctx) {
  const p = f.p, d = ctx.d, multi = !!p.multi;
  const sel = d.values[p.id];

  const def = defaultFor(p.id, d);
  const defs = def == null ? [] : (Array.isArray(def) ? def : [def]);
  const labels = (p.c || []).map(optLabel);
  // A signed-off default that is not one of the options rides the other… path
  // (card_dys_symptom_status): it shows as its own pill and writes through __other.
  const freeDef = p.other ? defs.filter(function (x) { return labels.indexOf(x) < 0; })[0] : null;
  const scoreOf = function (lab) {
    const o = (p.c || []).find(function (x) { return typeof x === "object" && x.label === lab; });
    return o && typeof o.v === "number" ? o.v : null;
  };
  const list = [];
  if (freeDef) list.push({ v: freeDef, t: freeDef, on: false, prop: true });
  labels.forEach(function (o) {
    const item = { v: o, t: o, on: picked.indexOf(o) >= 0, prop: defs.indexOf(o) >= 0 };
    if (p.score) item.sv = scoreOf(o);
    list.push(item);
  });
  if (p.other) list.push({ v: OTHER, t: "other…", on: picked.indexOf(OTHER) >= 0 });
  const writeFree = function () { d.values[p.id] = OTHER; d.values[p.id + "__other"] = freeDef; };
  const write = function (v) {
    if (freeDef && v === freeDef) { writeFree(); return; }
    if (multi) {
      const next = picked.slice();
      const i = next.indexOf(v);
      if (i >= 0) next.splice(i, 1); else next.push(v);
      setValue(p.id, next);
    } else setValue(p.id, picked.indexOf(v) >= 0 ? "" : v);
  };

function triControl(n, box, f, ctx) {

    else { setTriMode(line.id, v); setAttested(line.id, false); }

    { v: "given", t: "given", on: settled && m === "given" },
    { v: "withheld", t: withheldWord(line), on: settled && m === "withheld" },
    { v: "omit", t: "omit", on: settled && m === "omit", prop: true }
  ], false, function (v) { set(v); structuralEdit(); });

    const v = highlighted(n);
    if (v) set(v);
    return { rebuild: true };
  };
}

function escControl(n, box, f, ctx) {
  const line = f.line;
  const fired = ctx.d.esc[line.id] === "fired", settled = escSettled(line.id);
  const set = function (v) {
    if (v === "fired") { askEscalate(line); return true; }
    delete ctx.d.esc[line.id];
    setAttested(line.id, true);
    return false;
  };
  optionRow(n, box, [
    { v: "normal", t: "not fired", on: settled && !fired, prop: true },
    { v: "fired", t: "FIRED", on: fired }
  ], false, function (v) { if (!set(v)) structuralEdit(); });
  if (line.escalatesTo) box.appendChild(el("span", "ws-inline-note", line.escalatesTo));
  n._accept = function () {
    if (highlighted(n) === "fired") { set("fired"); return { hold: true }; }
    set("normal");
    return { rebuild: true };
  };

function forkControl(n, box, f, ctx) {
  const line = f.line, sel = forkSel(line.id), multi = !!line.multi;
  const write = function (v) {
    if (multi) {
      const next = sel.slice();
      const i = next.indexOf(v);
      if (i >= 0) next.splice(i, 1); else next.push(v);
      ctx.d.forks[line.id] = next;
    } else ctx.d.forks[line.id] = sel.indexOf(v) >= 0 ? "" : v;
  };
  optionRow(n, box, (line.options || []).map(function (o) {
    return { v: o.label, t: o.label, on: sel.indexOf(o.label) >= 0 };
  }), multi, function (v) { write(v); structuralEdit(); });
  n._accept = function () {
    const v = highlighted(n);
    if (v == null) return { rebuild: false };
    if (multi) { if (!sel.length) ctx.d.forks[line.id] = [v]; }
    else ctx.d.forks[line.id] = v;
    return { rebuild: true };
  };
}

function dispoControl(n, box, f, ctx) {
  optionRow(n, box, (DOC.dispositions || []).map(function (dsp) {
    return { v: dsp.id, t: dsp.name, on: ctx.d.disposition === dsp.id };
  }), false, function (v) {
    ctx.d.disposition = ctx.d.disposition === v ? null : v;
    structuralEdit();
  });
  n._accept = function () {
    const v = highlighted(n);
    if (v == null) return { rebuild: false };
    ctx.d.disposition = v;
    return { rebuild: true };
  };
}

/** Orientation: the four components, plus the ×4 shortcut its proposal stands for. */
function aoxControl(n, box, f, ctx) {
  const keys = aoxPicked(ctx.d.values, f.id).map(function (x) { return x.k; });
  const write = function (next) {
    setValue(f.id, AOX_KEYS.filter(function (k) { return next.indexOf(k) >= 0; }));
    structuralEdit();
  };
  optionRow(n, box, AOX.map(function (x) {
    return { v: x.k, t: x.t, on: keys.indexOf(x.k) >= 0, prop: true };
  }), true, function (v) {
    const next = keys.slice();
    const i = next.indexOf(v);
    if (i >= 0) next.splice(i, 1); else next.push(v);
    write(next);
  });
  const all = el("button", "pill aox-all", "×4 all");
  all.type = "button"; all.tabIndex = -1;
  all.addEventListener("click", function () { write(AOX_KEYS.slice()); });
  box.appendChild(all);
  n._accept = function () {
    if (keys.length) return { rebuild: false };
    setValue(f.id, AOX_KEYS.slice());
    return { rebuild: true };
  };
}

function openControl(n, box, f) {
  const b = el("button", "ws-openbtn", "+ add detail");
  b.type = "button"; b.tabIndex = 0;
  b.addEventListener("click", function () { ui.expanded[f.line.id] = true; structuralEdit(); });
  box.appendChild(b);
  n._accept = function () { ui.expanded[f.line.id] = true; return { rebuild: true }; };
}

/* ---- keyboard ---- */

/**
 * One roving cursor over FIELDS. Enter accepts and advances to the next open item;
 * Tab steps without accepting and falls through at the ends; arrows move the cursor
 * (up/down) or the highlighted option (left/right); Space toggles a chip.
 */
function onWorksheetKey(e) {
  const n = e.target.closest ? e.target.closest(".ws-field") : null;
  if (!n) return;
  const k = e.key;
  // Shift+Delete removes the field under the cursor — shifted, so a plain Delete
  // inside a text blank still edits the text it is standing in.
  if ((k === "Delete" || k === "Backspace") && e.shiftKey && n._f && DELETABLE_FIELD[n._f.type]) {
    e.preventDefault();
    deleteField(n._f.line.id, n._f.id);
    return;
  }
  if (k === "Enter") { e.preventDefault(); acceptField(n); return; }
  if (k === "Tab") { if (moveFocus(n, e.shiftKey ? -1 : 1)) e.preventDefault(); return; }
  if (k === "ArrowDown") { e.preventDefault(); moveFocus(n, 1); return; }
  if (k === "ArrowUp") { e.preventDefault(); moveFocus(n, -1); return; }
  if ((k === "ArrowLeft" || k === "ArrowRight") && n._opts) {
    e.preventDefault();
    setHighlight(n, n._hl + (k === "ArrowRight" ? 1 : -1));
    focusControl(n);
    return;
  }
  if (k === " " && n._opts) {
    e.preventDefault();
    const v = highlighted(n);
    if (v != null) n._pick(v);
    return;
  }
  // a scored field's own shortcut: a digit matching an option's `v` picks it and
  // advances, exactly like Enter would — no need to arrow over to it first.
  if (n._scoreMap && /^[0-9]$/.test(k) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const lab = n._scoreMap[k];
    if (lab != null) {
      e.preventDefault();
      const key = n.dataset.key;
      setValue(n._f.p.id, lab);
      structuralEdit();
      advanceFrom(key);
      return;
    }
  }
  // typing on an other:true pill run is a free-text override
  if (n._other && k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    typeOther(n, k);
  }
}
function typeOther(n, ch) {
  const f = n._f, d = draft();
  if (f.p && f.p.multi) {
    const cur = Array.isArray(d.values[f.id]) ? d.values[f.id].slice() : [];
    if (cur.indexOf(OTHER) < 0) cur.push(OTHER);
    d.values[f.id] = cur;
  } else d.values[f.id] = OTHER;
  d.values[f.id + "__other"] = ch;
  ui.focusKey = fieldKey(f.line.id, f.id + "__other");
  structuralEdit();
  focusControl(nodeForKey(ui.focusKey), ch.length);
}
function moveFocus(n, dir) {
  const all = fieldNodes();
  const i = all.indexOf(n);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= all.length) return false;
  focusFieldNode(all[j], true);
  return true;
}
function acceptField(n) {
  const key = n.dataset.key, f = n._f;
  const res = (n._accept ? n._accept() : null) || {};
  if (res.hold) return;                        // a modal owns the next step
  if (res.rebuild) structuralEdit();
  else { onFormEdit(); repaintField(key); }    // paintOpenStates skips the cursor's own field
  if (f.type === "open") {
    const first = document.querySelector('#worksheet .ws-row[data-line="' +
      cssEsc(f.line.id) + '"] .ws-field');
    focusFieldNode(first, true);
    return;
  }
  advanceFrom(key);
}
/** Next open item after `key`; wraps once; past the last one the cursor leaves for Copy. */
function advanceFrom(key) {
  const all = fieldNodes();
  const i = all.findIndex(function (n) { return n.dataset.key === key; });
  for (let j = i + 1; j < all.length; j++) {
    if (isUnresolved(all[j])) { focusFieldNode(all[j], true); return; }
  }
  const wrap = all.find(isUnresolved);
  if (wrap) { focusFieldNode(wrap, true); return; }
  const copy = document.getElementById("copy-btn");
  if (copy) copy.focus();
}

/** Soft clock validation — red outline only, never blocks. */
function markTime(input) {
  const v = input.value.trim();
  let bad = false;
  if (v !== "") {
    if (!/^\d{4}$/.test(v)) bad = true;
    else {
      const h = +v.slice(0, 2), m = +v.slice(2);
      bad = h > 23 || m > 59;
    }
  }
  input.classList.toggle("bad", bad);
}

/* ============================ value plumbing ============================ */

function setValue(id, v) {
  const d = draft();
  if (Array.isArray(v)) { if (v.length) d.values[id] = v; else delete d.values[id]; }
  else if (nonEmpty(v)) d.values[id] = v;
  else delete d.values[id];
  onFormEdit();
}

/**
 * Called after a VALUE change. The assembly always re-runs — the worksheet's field
 * states come from it — but the worksheet itself is only rebuilt when the change
 * moved a row in or out; otherwise summaries are repainted around the live control,
 * so a caret in a text blank survives typing.
 */
function onFormEdit() {
  if (draft().polish) {
    lastAsm = assemble(context());
    buildOpenIndex(lastAsm);
    warnPolish();
  } else renderPreview();
  if (condSignature(context()) !== ui.condSig) renderWorksheet();
  else paintOpenStates();
  scheduleSave();
}

/** Called after a STRUCTURAL change the user made: full form rebuild + polish guard. */
function structuralEdit() {
  if (draft().polish) warnPolish();
  renderAll();
}

/* ============================ PREVIEW ============================ */

let lastAsm = null;

function renderPreview() {
  const ctx = context();
  const asm = assemble(ctx);
  lastAsm = asm;
  buildOpenIndex(asm);
  const pv = document.getElementById("preview");
  const d = draft();

  if (d.polish) {
    pv.classList.add("polishing");
    pv.setAttribute("contenteditable", "true");
    // live sync paused: never overwrite the buffer while the SAME draft is editing,
    // but a draft switch must repaint the incoming draft's own buffer
    if (pv.dataset.draftId !== d.id) pv.textContent = d.polish.text;
  } else {
    pv.classList.remove("polishing");
    pv.removeAttribute("contenteditable");
    pv.innerHTML = assemblyHtml(asm);
  }
  pv.dataset.draftId = d.id;
  markPreviewFocus();
  updateCounter(currentText());
  paintMissingBadge();
  disarmCopy();
  document.getElementById("polish-banner").hidden = !d.polish;
  const toggleBtn = document.getElementById("polish-toggle");
  toggleBtn.textContent = d.polish ? "Exit polish" : "Polish";
  toggleBtn.classList.toggle("on", !!d.polish);
}

/** @returns {string} what Copy would put on the clipboard right now */
function currentText() {
  const d = draft();
  if (d.polish) return d.polish.text;
  return assemblyText(lastAsm || assemble(context()));
}

function updateCounter(text) {
  const n = charCount(text);
  const over = n - CHAR_RED;
  const c = document.getElementById("char-counter");
  const w = document.getElementById("char-warning");
  let label = n.toLocaleString("en-US") + " / " + CHAR_RED.toLocaleString("en-US");
  if (over > 0) label += " · " + over.toLocaleString("en-US") + " over";
  else if (n >= CHAR_AMBER) label += " · " + (CHAR_RED - n).toLocaleString("en-US") + " left";
  c.textContent = label;
  c.classList.toggle("amber", n >= CHAR_AMBER && over <= 0);
  c.classList.toggle("red", over > 0);
  if (over > 0) {
    w.hidden = false;
    w.textContent = "emsCharts HPI cap 4,000 — paste will truncate silently. Trim " + over.toLocaleString("en-US") + " characters.";
  } else w.hidden = true;
}

/** A run of 3+ underscores counts as one blank, however long the run. */
function countBlanks(text) {
  const m = String(text || "").match(/_{3,}/g);
  return m ? m.length : 0;
}

/** Open items split by kind: AMBER blanks to fill, PROPOSED defaults to confirm,
 *  DUPLICATE repeated sentences. Duplicates count their own way so Copy can name them
 *  without inflating "to fill". */
function openCounts() {
  const m = (lastAsm && lastAsm.missing) || [];
  let missing = 0, proposed = 0, duplicate = 0;
  m.forEach(function (x) {
    if (x.kind === "proposed") proposed++;
    else if (x.kind === "duplicate") duplicate++;
    else missing++;
  });
  return { missing: missing, proposed: proposed, duplicate: duplicate,
           open: missing + proposed + duplicate };
}

/** Repaint #missing-badge: text-derived while polishing, worksheet-derived otherwise. */
function paintMissingBadge() {
  const badge = document.getElementById("missing-badge");
  const d = draft();
  if (d.polish) {
    const n = countBlanks(d.polish.text);
    badge.hidden = n === 0;
    badge.textContent = n + " ___ in text";
  } else {
    const n = openCounts().open;
    badge.hidden = n === 0;
    badge.textContent = n + " open";
  }
}

/** Copy button resting label: base "Copy", draft suffix (2+ drafts), open-count suffix. */
function paintCopyLabel() {
  const copy = document.getElementById("copy-btn");
  const d = draft();
  let label = "Copy";
  if (state.drafts.length >= 2) label += " — " + d.label;
  if (d.polish) {
    const n = countBlanks(d.polish.text);
    if (n > 0) label += " (" + n + " ___)";
  } else {
    const n = openCounts().open;
    if (n > 0) label += " (" + n + " open)";
  }
  copy.textContent = label;
}

/** Any edit invalidates an armed copy-confirm: disarm and repaint the resting label. */
function disarmCopy() {
  ui.copyPending = false;
  document.getElementById("copy-btn").classList.remove("confirming");
  paintCopyLabel();
}

/* ---- click-to-jump (prose → worksheet) ---- */

function firstFieldOfLine(lineId) {
  return document.querySelector('#worksheet .ws-row[data-line="' + cssEsc(lineId) + '"] .ws-field');
}
function jumpToField(fieldId, lineId) {
  let n = lineId ? nodeForKey(fieldKey(lineId, fieldId)) : null;
  if (!n) n = document.querySelector('#worksheet .ws-field[data-field="' + cssEsc(fieldId) + '"]');
  if (!n && lineId) n = firstFieldOfLine(lineId);
  focusFieldNode(n, true);
}
function jumpToLine(lineId) { focusFieldNode(firstFieldOfLine(lineId), true); }

/* ============================ structural actions ============================ */

/**
 * A category pick sets the PRIMARY owner (block or template) at index 0 and keeps
 * every manually stacked extra behind it. Swapping the primary is a correction of
 * what the call was, not a deletion of charted material.
 */
function pickCategory(name) {
  const d = draft();
  d.category = name;
  const hit = CATEGORY_INDEX[name];
  if (!hit) { renderAll(); return; }
  // index 0 is the primary owner; manually stacked extras are preserved after it
  const extras = d.blockIds.slice(1).filter(function (id) { return id !== hit.id; });
  d.blockIds = [hit.id].concat(extras);
  pruneOrphanEsc(d);
  seedSubs(hit.id);
  structuralEdit();
}

/**
 * Drop escalation marks whose owning box has left the stack. A fired esc line is
 * carried into the slot by assembleSlot even when its owner is gone (so a swap cannot
 * silently unfire it mid-call), which is right while the box is being replaced — but
 * once the medic has actually removed the box, that carry re-emits a sentence with no
 * box behind it. Removing the box removes its escalation with it.
 * Shell- and disposition-owned esc lines have no box to lose, so they are left alone.
 */
function pruneOrphanEsc(d) {
  Object.keys(d.esc || {}).forEach(function (lineId) {
    const rec = LINE_INDEX[lineId];
    if (!rec) { delete d.esc[lineId]; return; }
    if (rec.ownerType !== "block" && rec.ownerType !== "template") return;
    if (d.blockIds.indexOf(rec.ownerId) < 0) delete d.esc[lineId];
  });
}
function seedSubs(blockId) {
  const b = (DOC.blocks || {})[blockId];
  const d = draft();
  if (b && b.subBlocks && b.subBlocks.length && !d.subs[blockId]) d.subs[blockId] = [b.subBlocks[0].id];
}
/**
 * Append an owner id to the stack if it is not already there. Never replaces.
 * @param {Object} d the ACTIVE draft — seedSubs resolves draft() on its own, so
 *   this must not be called with a draft that is not currently selected.
 * @param {string} id block or template id
 */
function pushOwner(d, id) {
  if (d.blockIds.indexOf(id) < 0) d.blockIds.push(id);
  seedSubs(id);
}
function addBlock(id) {
  pushOwner(draft(), id);
  structuralEdit();
}
function blockHasValues(id) {
  const bag = OWNER_FIELDS["block:" + id] || OWNER_FIELDS["template:" + id];
  const d = draft();
  if (!bag) return false;
  let hit = false;
  bag.forEach(function (f) { if (nonEmpty(d.values[f])) hit = true; });
  return hit;
}
function removeBlock(id) {
  const drop = function () {
    const d = draft();
    d.blockIds = d.blockIds.filter(function (x) { return x !== id; });
    delete d.subs[id];
    pruneOrphanEsc(d);
    // The box stops being an orderable unit, so its top-level place, its own line order
    // and its paragraph go with it. Lines of this box that the medic had dragged into
    // OTHER regions are left stored exactly where they are: the assembler simply stops
    // emitting them, and adding the box back restores them where the medic had them.
    if (d.topOrder) d.topOrder = d.topOrder.filter(function (x) { return x !== "owner:" + id; });
    delete d.lineOrder["owner:" + id];
    delete d.paraOverrides["owner:" + id];
    structuralEdit();
  };
  if (!blockHasValues(id)) { drop(); return; }
  openModal({
    title: "Remove block?",
    body: "This block has entered values. Removing it drops them from the narrative.",
    actions: [{ label: "Cancel", cls: "quiet" }, { label: "Remove", cls: "danger", onClick: drop }]
  });
}
function toggleSub(owner, sb, multi) {
  const d = draft();
  const cur = d.subs[owner.id] || [owner.subBlocks[0].id];
  let next;
  if (multi) {
    next = cur.slice();
    const i = next.indexOf(sb.id);
    if (i >= 0) next.splice(i, 1); else next.push(sb.id);
  } else next = [sb.id];
  d.subs[owner.id] = next;
  structuralEdit();
}

/* ---- escalation ---- */

function askEscalate(line) {
  const targets = line.targets || [];
  if (!targets.length) { draft().esc[line.id] = "fired"; renderAll(); return; }
  let choice = targets[0];
  const body = el("div");
  body.appendChild(el("p", null, "Add " + choice.label + " after this block? Entered values carry over."));
  if (targets.length > 1) {
    const row = el("div", "modal-pills");
    row.setAttribute("role", "radiogroup");
    const btns = targets.map(function (t) {
      const b = el("button", "pill" + (t === choice ? " on" : ""), t.label);
      b.type = "button";
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", t === choice ? "true" : "false");
      b.addEventListener("click", function () {
        choice = t;
        Array.prototype.forEach.call(row.children, function (c, i) {
          c.classList.toggle("on", targets[i] === choice);
        });
        body.firstChild.textContent = "Add " + choice.label + " after this block? Entered values carry over.";
      });
      return b;
    });
    btns.forEach(function (b) { row.appendChild(b); });
    body.appendChild(row);
  }
  openModal({
    title: "Escalation",
    bodyNode: body,
    actions: [
      { label: "Cancel", cls: "quiet" },            // cancel: state untouched, pill reverts on re-render
      { label: "Add", cls: "primary", onClick: function () { doEscalate(line, choice); } }
    ],
    onClose: function () { renderAll(); }
  });
}

/**
 * Apply an escalation: mark fired, copy carry values, APPEND the target owner.
 * The chart is chronological — the source block stays exactly where it is and keeps
 * rendering ahead of the target. Target kind is irrelevant here: block ids and
 * template ids share one stack.
 */
function doEscalate(line, target) {
  const d = draft();
  d.esc[line.id] = "fired";
  const carry = line.carry || {};
  Object.keys(carry).forEach(function (src) {
    // "=fieldId": "literal" sets a constant on the target (e.g. a status choice
    // the source block implies but has no field for)
    if (src.charAt(0) === "=") { d.values[src.slice(1)] = carry[src]; return; }
    if (nonEmpty(d.values[src])) d.values[carry[src]] = d.values[src];
  });
  pushOwner(d, target.id);
  // A target may pull an addendum template in behind it — stacked, in that order.
  if (target.addendum) pushOwner(d, target.addendum);
  structuralEdit();
}

/* ---- OB infant hand-off ---- */

function maybeHandoffButton(host, owner, ctx) {
  const h = owner.handoff;
  if (!h) return;
  if (h.whenFork) {
    const sel = forkSel(h.whenFork.lineId);
    if (sel.indexOf(h.whenFork.option) < 0) return;
  }
  const b = el("button", "handoff-btn", h.buttonLabel || "Start second narrative");
  b.type = "button";
  b.addEventListener("click", function () { startHandoff(owner); });
  host.appendChild(b);
}

/** Create a second draft carrying the declared values. Source draft untouched. */
function startHandoff(owner) {
  const h = owner.handoff;
  const src = draft();
  const nd = makeDraft(h.newLabel || "Infant", src.unit);
  nd.category = h.category || src.category;
  const hit = CATEGORY_INDEX[nd.category];
  if (hit) nd.blockIds = [hit.id];        // primary owner, block or template alike
  Object.keys(h.carry || {}).forEach(function (s) {
    if (nonEmpty(src.values[s])) nd.values[h.carry[s]] = src.values[s];
  });
  if (nd.blockIds.length) {
    const b = (DOC.blocks || {})[nd.blockIds[0]];
    if (b && b.subBlocks && b.subBlocks.length) nd.subs[nd.blockIds[0]] = [b.subBlocks[0].id];
  }
  state.drafts.push(nd);
  state.activeDraft = state.drafts.length - 1;
  ui.polishWarned = false;
  renderAll();
}

/* ============================ polish mode ============================ */

function togglePolish() {
  const d = draft();
  if (d.polish) {
    if (d.polish.dirty) {
      openModal({
        title: "Discard polish edits?",
        body: "Hand-edited text will be replaced by the form narrative. This can't be undone.",
        actions: [
          { label: "Keep editing", cls: "quiet" },
          { label: "Discard edits", cls: "danger", onClick: function () {
              const d = draft();
              d.polish = null; ui.polishWarned = false; renderAll();
            } }
        ]
      });
      return;
    }
    d.polish = null; ui.polishWarned = false; renderAll(); return;
  }
  const text = assemblyText(lastAsm || assemble(context()));
  d.polish = { text: text, dirty: false };
  const pv = document.getElementById("preview");
  pv.textContent = text;
  pv.setAttribute("contenteditable", "true");

function warnPolish() {
  if (ui.polishWarned) return;
  ui.polishWarned = true;
  openModal({
    title: "Form changed",
    body: "form changed — re-sync discards polish edits",
    actions: [
      { label: "Keep polish", cls: "quiet" },
      { label: "Re-sync", cls: "primary", onClick: function () {
          const d = draft();
          const text = assemblyText(assemble(context()));
          d.polish = { text: text, dirty: false };
          const pv = document.getElementById("preview");
          pv.textContent = text;
          ui.polishWarned = false;
          renderPreview();
        } }
    ]
  });
}

/* ============================ copy ============================ */

/** The gate is clear only when nothing is left to fill AND nothing is left to confirm. */
function doCopy() {
  const btn = document.getElementById("copy-btn");
  const c = openCounts();
  const openActive = c.open > 0 && !draft().polish;
  const over = charCount(currentText()) - CHAR_RED;
  const overActive = over > 0;
  if ((openActive || overActive) && !ui.copyPending) {
    ui.copyPending = true;
    const bits = [];
    if (openActive && c.missing) bits.push(c.missing + " to fill");
    if (openActive && c.proposed) bits.push(c.proposed + " to confirm");
    if (openActive && c.duplicate) bits.push(c.duplicate + " duplicate");
    if (overActive) bits.push(over.toLocaleString("en-US") + " over cap");
    btn.textContent = bits.join(" · ") + " — press again to copy anyway";
    btn.classList.add("confirming");
    return;
  }
  ui.copyPending = false;
  btn.classList.remove("confirming");
  const text = currentText();
  const done = function () {
    setStatus("copied");
    btn.textContent = "Copied ✓";
    setTimeout(function () { renderPreview(); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
  } else legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) { done(); return; }
  setStatus("copy failed — select the preview and copy manually");
  renderPreview();                       // restore the button's normal label
}

/* ============================ modal ============================ */

function openModal(cfg) {
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  root.hidden = false;
  const card = el("div", "modal-card");
  card.appendChild(el("div", "modal-title", cfg.title || ""));
  const body = el("div", "modal-body");
  if (cfg.bodyNode) body.appendChild(cfg.bodyNode);
  else body.appendChild(el("p", null, cfg.body || ""));
  card.appendChild(body);
  const row = el("div", "modal-actions");
  const close = function () {
    root.hidden = true; root.innerHTML = "";
    document.removeEventListener("keydown", onKey);
    if (cfg.onClose) cfg.onClose();
  };
  (cfg.actions || [{ label: "OK", cls: "primary" }]).forEach(function (a) {
    const b = el("button", "modal-btn " + (a.cls || ""), a.label);
    b.type = "button";
    b.addEventListener("click", function () {
      close();
      if (a.onClick) a.onClick();
    });
    row.appendChild(b);
  });
  card.appendChild(row);
  root.appendChild(card);
  root.addEventListener("click", function (e) { if (e.target === root) close(); }, { once: true });
  const onKey = function (e) { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const first = row.querySelector("button");
  if (first) first.focus();
}

/* ============================ persistence (sessionStorage ONLY) ============================ */

let saveTimer = null;
let ssOK = true;
function probeStorage() {

    sessionStorage.removeItem(SS_KEY + "__probe");

  } catch (e) { return false; }
}
function scheduleSave() {

  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}
function saveNow() {

}
/** Old saved drafts stored typed dispatch-location text directly on sh_dispatch_loc
 * (now a pill field); fold it into the "other" pill + its paired free-text field.
 * They also stored a typed orientation score on sh_aox_score (now the computed
 * sh_aox component list): only "4" names its components unambiguously, so that
 * one converts and every other score is dropped rather than guessed at. */
function migrateDraft(d) {
  const v = d.values && d.values["sh_dispatch_loc"];
  if (typeof v === "string" && nonEmpty(v) && v !== "above address" && v !== OTHER) {
    d.values["sh_dispatch_loc__other"] = v;
    d.values["sh_dispatch_loc"] = OTHER;
  }
  const score = d.values && d.values["sh_aox_score"];
  if (score != null) {
    if (String(score).trim() === "4" && !nonEmpty(d.values["sh_aox"])) {
      d.values["sh_aox"] = AOX.map(function (x) { return x.k; });
    }
    delete d.values["sh_aox_score"];
  }
}
function restore() {
  let raw = null;
  try { raw = sessionStorage.getItem(SS_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.drafts) || !parsed.drafts.length) return false;
    parsed.drafts = parsed.drafts.map(function (d) {
      const base = makeDraft(d.label, d.unit);
      const m = Object.assign(base, d, {
        values: d.values || {}, forks: d.forks || {}, esc: d.esc || {},
        attested: d.attested || {},          // drafts saved before attestations existed
        hidden: d.hidden || {},              // drafts saved before deletion existed
        naSections: d.naSections || {}, subs: d.subs || {}, blockIds: d.blockIds || [],
        // Drafts saved before ordering existed are pristine by definition: no stored
        // order at all, which is exactly what null / empty say (see ORDERING).
        topOrder: d.topOrder || null, lineOrder: d.lineOrder || {},
        paraOverrides: d.paraOverrides || {},
        showAnyway: d.showAnyway || {}   // drafts saved before twin dedupe existed
      });
      // Migrate pre-owner-stack drafts: the old activeTemplate / activeAddendum pair
      // becomes the tail of the one owner stack, in that order.
      if (m.activeTemplate) {
        if (m.blockIds.indexOf(m.activeTemplate) < 0) m.blockIds.push(m.activeTemplate);
        if (m.activeAddendum && m.blockIds.indexOf(m.activeAddendum) < 0) {
          m.blockIds.push(m.activeAddendum);
        }
      }
      delete m.activeTemplate;
      delete m.activeAddendum;
      // Paragraph identity used to be an int 1..4; it is a token now (see PARA_SHELL).
      // A block's paragraph did not exist back then, so every stored int is a shell one.
      Object.keys(m.paraOverrides).forEach(function (k) {
        const v = m.paraOverrides[k];
        if (typeof v !== "number") return;
        const tok = PARA_SHELL[v - 1];
        if (tok) m.paraOverrides[k] = tok; else delete m.paraOverrides[k];

      return m;
    });

}
function setStatus(t) { document.getElementById("save-state").textContent = t; }

function newCall() {
  openModal({
    title: "New call",
    body: "Wipe this narrative and start a new call? This cannot be undone.",
    actions: [
      { label: "Cancel", cls: "quiet" },
      { label: "New call", cls: "danger", onClick: function () {
          try { sessionStorage.removeItem(SS_KEY); } catch (e) { /* noop */ }
          state = { drafts: [makeDraft("Call")], activeDraft: 0 };
          ui.expanded = {}; ui.polishWarned = false; ui.copyPending = false; ui.focusKey = null;
          const cs = document.getElementById("category-select");
