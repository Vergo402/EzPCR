<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCR Narrative Builder</title>
<style>
/* PCR Narrative Builder v1 — stylesheet (reconciled to engine markup). Light mode only. */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: #f4f4f2; color: #1c1c1a;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
:root {
  --border: #ddd; --border-strong: #ccc;
  --text: #1c1c1a; --text-dim: #666; --text-faint: #888; --text-label: #555;
  --green-bg: #e7f4ea; --green-text: #1a7f37;
  --amber-bg: #fff3d6; --amber-text: #9a6700;
  --gray-bg: #eee; --gray-text: #555;
  --red-bg: #ffe5e5; --red-text: #c00;
  --blue-bg: #e7f0fb; --blue-text: #175cd3;
  --blue-solid: #1a56db; --blue-solid-hover: #1746b3;
  --radius: 8px; --radius-sm: 5px; --focus-ring: #1a56db;
}
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 3px; }

/* ---- topbar ---- */
#topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: #fff; border-bottom: 1px solid var(--border);
  padding: 10px 16px; position: sticky; top: 0; z-index: 40;
}
#topbar .brand { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap; }
#version-tag { font-size: 12px; font-weight: 400; color: var(--text-faint); }
.topbar-controls { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.tb-field { display: inline-flex; align-items: center; gap: 5px; }
.tb-label { font-size: 11px; color: var(--text-faint); }
select, input[type="text"] {
  font: inherit; font-size: 13px; color: var(--text); background: #fff;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  height: 30px; padding: 0 8px;
}
select:hover, input[type="text"]:hover { border-color: #b8b8b8; }
#category-select { min-width: 230px; }
#unit-other { width: 6em; }
button {
  font: inherit; font-size: 13px; cursor: pointer; border-radius: var(--radius-sm);
  height: 30px; padding: 0 12px; background: #fff;
  border: 1px solid var(--border-strong); color: var(--text);
}
button:hover { background: #f7f7f6; border-color: #b8b8b8; }
button:active { background: #eee; }
#new-call { border-color: #e2b8b8; color: #a33; }
#new-call:hover { background: #fff3f3; }
.add-block-wrap { position: relative; }
#add-block-popup {
  position: absolute; top: 34px; left: 0; z-index: 50; background: #fff;
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; min-width: 240px;
  max-height: 60vh; overflow-y: auto;
}
.popup-row {
  display: block; width: 100%; text-align: left; background: transparent;
  border: none; height: auto; padding: 7px 10px; font-size: 13px; border-radius: 5px;
}
.popup-row:hover { background: #f0f4fb; color: var(--blue-text); }
.popup-head { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-weight: 600; padding: 7px 10px 2px; }
.popup-head + .popup-head, .popup-row + .popup-head { border-top: 0.5px solid var(--border); margin-top: 4px; }
#draft-switcher { display: inline-flex; gap: 2px; background: #eee; border-radius: var(--radius-sm); padding: 2px; }
.draft-tab { border: none; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; font-size: 12px; color: var(--text-dim); }
.draft-tab:hover { background: rgba(0,0,0,.04); }
.draft-tab.active { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* ---- panes ---- */
#panes { display: flex; align-items: flex-start; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; }
#form-pane { flex: 0 0 55%; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
#shell-top, #shell-bottom, #block-slot { display: flex; flex-direction: column; gap: 12px; }
#preview-pane {
  flex: 1 1 45%; min-width: 0; position: sticky; top: 62px; align-self: flex-start;
  max-height: calc(100vh - 80px); display: flex; flex-direction: column;
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
}
#statusbar { font-size: 11px; color: var(--text-faint); padding: 6px 16px; border-top: 1px solid var(--border); background: #fff; }

/* ---- cards ---- */
.section-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text-label); letter-spacing: .01em; }
.card-tools { display: flex; gap: 6px; align-items: center; }
.card-body { display: flex; flex-direction: column; gap: 8px; }
.lines { display: flex; flex-direction: column; gap: 9px; }
.card-intro, .card-note { font-size: 11px; color: var(--text-faint); line-height: 1.5; }
.section-card.na .lines, .section-card.na .expander { opacity: .35; }
.rm-block { width: 24px; height: 24px; padding: 0; line-height: 1; border-radius: 50%; color: var(--text-dim); font-size: 14px; }
.rm-block:hover { background: var(--red-bg); border-color: #e2b8b8; color: var(--red-text); }
.na-toggle { height: 22px; padding: 0 10px; font-size: 11px; border-radius: 999px; color: var(--text-dim); background: #fafafa; }
.na-toggle.on { background: var(--gray-bg); color: var(--gray-text); font-weight: 600; }
.pt-contact { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.sub-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
.sub-pill { height: 26px; padding: 0 12px; font-size: 12px; border-radius: 999px; }
.sub-pill.on { background: var(--blue-bg); color: var(--blue-text); border-color: #b9d1f2; font-weight: 600; }
.sub-group { display: flex; flex-direction: column; gap: 9px; padding: 8px 0 2px; }
.sub-head { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: none; }
.handoff-btn { align-self: flex-start; border-color: #b9d1f2; color: var(--blue-text); background: var(--blue-bg); }
.handoff-btn:hover { background: #d9e8fb; }

/* expander */
.expander { display: flex; flex-direction: column; gap: 6px; }
.expander-toggle {
  align-self: flex-start; font-size: 12px; color: var(--blue-text);
  background: transparent; border: none; height: auto; padding: 2px 0;
}
.expander-toggle:hover { text-decoration: underline; background: transparent; }
.expander-body {
  display: flex; flex-direction: column; gap: 9px; padding: 10px;
  background: #fafaf9; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
}

/* ---- lines ---- */
.line { display: flex; flex-direction: column; gap: 4px; border-radius: 6px; }
.line.flash { animation: flashbg .9s ease-out; }
@keyframes flashbg { 0% { background: var(--blue-bg); } 100% { background: transparent; } }
.line-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.line-label { font-size: 13px; color: var(--text); }
.line-hint { font-size: 11px; color: var(--text-faint); font-style: italic; }
.line-note { font-size: 11px; color: var(--text-faint); }
.line-inputs { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; margin-left: 2px; }
.lit { font-size: 12.5px; color: var(--text-dim); }
.fld { display: inline-flex; }
.grp { display: inline-flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.opt-detail { display: inline-flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.fork-row { display: flex; gap: 6px; flex-wrap: wrap; }
.fork-lines { display: flex; flex-direction: column; gap: 9px; margin-left: 14px; padding-left: 10px; border-left: 2px solid #eee; }
.line-inputs input[type="text"] { height: 28px; font-size: 13px; }
input.time { font-variant-numeric: tabular-nums; }
input.time.bad { border-color: var(--red-text); box-shadow: 0 0 0 1px var(--red-text) inset; }
.other-input { margin-left: 2px; }

/* ---- segmented + pills + chips ---- */
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; background: #fff; }
.seg-btn { border: none; border-radius: 0; background: transparent; height: 24px; padding: 0 11px; font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.seg-btn + .seg-btn { border-left: 1px solid var(--border); }
.seg-btn:hover { background: #f7f7f6; }
.seg-btn.on { font-weight: 600; }
.seg-btn.on.seg-given { background: var(--green-bg); color: var(--green-text); }
.seg-btn.on.seg-withheld { background: var(--amber-bg); color: var(--amber-text); }
.seg-btn.on.seg-omit { background: var(--gray-bg); color: var(--gray-text); }
.seg-btn.on.seg-fired { background: var(--red-bg); color: var(--red-text); font-weight: 700; }
.seg-btn.on.seg-normal { background: var(--gray-bg); color: var(--gray-text); }
.pills, .chips { display: inline-flex; gap: 5px; flex-wrap: wrap; }
.pill, .chip { height: 25px; padding: 0 11px; font-size: 12px; border-radius: 999px; }
.pill.on, .chip.on { background: var(--blue-bg); color: var(--blue-text); border-color: #b9d1f2; font-weight: 600; }
.modal-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ---- disposition ---- */
.disp-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.disp-pill { height: 28px; padding: 0 14px; font-size: 12px; border-radius: 999px; }
.disp-pill.on { background: var(--blue-bg); color: var(--blue-text); border-color: #b9d1f2; font-weight: 600; }

/* ---- preview ---- */
#preview-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#char-counter { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: auto; }
#char-counter.amber { color: var(--amber-text); font-weight: 600; }
#char-counter.red { color: var(--red-text); font-weight: 700; }
#char-warning { font-size: 11px; color: var(--red-text); padding: 6px 14px; background: var(--red-bg); border-bottom: 1px solid var(--border); }
#missing-badge { font-size: 11px; font-weight: 600; color: var(--red-text); background: var(--red-bg); border-radius: 999px; padding: 2px 9px; }
#polish-banner { font-size: 12px; color: var(--blue-text); background: var(--blue-bg); padding: 7px 14px; border-bottom: 1px solid var(--border); }
#polish-toggle.on { background: var(--blue-bg); color: var(--blue-text); border-color: #b9d1f2; }
#copy-btn { background: var(--blue-solid); border-color: var(--blue-solid); color: #fff; font-weight: 600; }
#copy-btn:hover { background: var(--blue-solid-hover); border-color: var(--blue-solid-hover); }
#copy-btn.confirming { background: #fff; color: var(--red-text); border-color: #e2b8b8; }
#copy-btn.confirming:hover { background: var(--red-bg); }
#missing-list { border-bottom: 1px solid var(--border); max-height: 30vh; overflow-y: auto; }
.ml-group { padding-bottom: 4px; }
.ml-head { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); font-weight: 600; padding: 8px 14px 2px; }
.ml-row {
  display: block; width: 100%; text-align: left; background: #fff8f8;
  border: none; border-bottom: 1px solid #f2eaea; border-radius: 0;
  height: auto; padding: 5px 14px; font-size: 12px; color: var(--red-text);
}
.ml-row:hover { text-decoration: underline; background: var(--red-bg); }
#preview {
  flex: 1; overflow-y: auto; padding: 14px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
}
#preview[contenteditable="true"] { outline: none; background: #fffdf5; }
.pv-line { cursor: pointer; border-radius: 3px; padding: 0 2px; margin: 0 -2px; }
.pv-line:hover { background: #f2f5fa; }
.pv-blank { background: var(--red-bg); color: var(--red-text); border-radius: 2px; padding: 0 2px; font-weight: 600; }
.pv-withheld { background: var(--amber-bg); border-radius: 2px; }

/* ---- modal ---- */
#modal-root {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-card { background: #fff; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,.25); width: 100%; max-width: 440px; padding: 20px; }
.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.modal-body { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.5; }
.modal-body p { margin: 0 0 6px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-btn.primary { background: var(--blue-solid); border-color: var(--blue-solid); color: #fff; font-weight: 600; }
.modal-btn.primary:hover { background: var(--blue-solid-hover); }
.modal-btn.danger { background: var(--red-text); border-color: var(--red-text); color: #fff; font-weight: 600; }
.modal-btn.danger:hover { background: #a80000; }

/* ---- responsive ---- */
@media (max-width: 899px) {
  #panes { flex-direction: column; }
  #form-pane, #preview-pane { flex: 1 1 auto; width: 100%; }
  #preview-pane { position: static; max-height: none; }
  .topbar-controls { margin-left: 0; width: 100%; }
}
@media (min-width: 1100px) { #panes { padding: 20px; gap: 20px; } }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">PCR Narrative Builder <span id="version-tag">Builder v1 · source v0.8 · NYS v26.1</span></div>
  <div class="topbar-controls">
    <label class="tb-field"><span class="tb-label">Unit</span>
      <select id="unit-select">
        <option value="35M1">35M1</option>
        <option value="__other__">other…</option>
      </select>
      <input id="unit-other" type="text" placeholder="unit" size="8" hidden>
    </label>
    <label class="tb-field"><span class="tb-label">Category</span>
      <select id="category-select"></select>
    </label>
    <div class="tb-field add-block-wrap">
      <button id="add-block" type="button">+ add block</button>
      <div id="add-block-popup" hidden></div>
    </div>
    <div id="draft-switcher" hidden></div>
    <button id="new-call" type="button">New call</button>
  </div>
</header>

<main id="panes">
  <section id="form-pane">
    <div id="shell-top"></div>
    <div id="block-slot"></div>
    <div id="shell-bottom"></div>
    <div id="disposition-card" class="section-card"></div>
  </section>

  <section id="preview-pane">
    <div id="preview-head">
      <span id="char-counter">0</span>
      <span id="missing-badge" hidden>0 missing</span>
      <button id="polish-toggle" type="button">Polish</button>
      <button id="copy-btn" type="button">Copy</button>
    </div>
    <div id="char-warning" hidden></div>
    <div id="polish-banner" hidden>editing — live sync paused</div>
    <div id="missing-list" hidden></div>
    <div id="preview"></div>
  </section>
</main>

<footer id="statusbar"><span id="save-state">ready</span></footer>
<div id="modal-root" hidden></div>

/* -------------------------------------------------------------------------
   Config constants. These are ENGINE config named by SPEC-engine (§7, §16),
   not clinical content: block/template ids the cond rules key off, and the
   hospital datalist. DOC may override the hospital list.
   ------------------------------------------------------------------------- */
const UNIT_TOKEN = "35M___";
const OTHER = "__other__";
const BL0 = "\uE000", BL1 = "\uE001";           // blank sentinels (stripped from text)
const SS_KEY = "pcrb_state";
const W_MAP = { 4: "3.5em", 8: "6em", 16: "11em", 32: "18em", 64: "100%" };
const HOSPITALS = DOC.hospitals ||
  ["Phelps Memorial", "Northern Westchester", "NYP-Hudson Valley", "Westchester Medical"];

  sexField: "sh_pt_sex",
  ageField: "sh_pt_age",
  molstBlocks: ["doa"],
  molstTemplates: ["cardiacArrest"],
  loiBlocks: ["cardiac", "abdominal", "metabolic"]

const CHAR_RED_MSG = "emsCharts HPI cap 4,000 — will truncate silently.";

/* ============================ small utilities ============================ */

/** @param {*} v @returns {boolean} true when a stored value is meaningfully filled */
function nonEmpty(v) {
  if (v == null) return false;
  if (Array.isArray(v)) return v.length > 0;
  return String(v).trim() !== "";
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function stripSentinels(s) { return s.split(BL0).join("").split(BL1).join(""); }
function replaceAllStr(s, find, rep) { return s.split(find).join(rep); }
/** Oxford-style join: "a" / "a and b" / "a, b, and c" */
function oxford(list) {
  const a = list.filter(function (x) { return x !== ""; });
  if (a.length === 0) return "";
  if (a.length === 1) return a[0];
  if (a.length === 2) return a[0] + " and " + a[1];
  return a.slice(0, -1).join(", ") + ", and " + a[a.length - 1];
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function uid() { return "d" + Math.random().toString(36).slice(2, 9); }
function optLabel(o) { return typeof o === "string" ? o : o.label; }
/**
 * Section behavior may be a string (legacy), an array, or null — normalize on read.
 * @param {Object} s section @param {string} name behavior flag @returns {boolean}
 */
function hasBehavior(s, name) {
  const b = s && s.behavior;
  if (!b) return false;
  return Array.isArray(b) ? b.indexOf(name) >= 0 : b === name;
}
function isTimeField(p) {
  const id = p.f || p.id || "";
  if (/_time$/.test(id)) return true;
  return !!(p.hint && /\btime\b/i.test(p.hint));
}

/* ============================ DOC indexing ============================ */

/** lineId -> {line, ownerType:"shell"|"block"|"template"|"disposition", ownerId, sectionId, sectionName} */
const LINE_INDEX = Object.create(null);
/** ownerKey -> Set of field ids (fills + choice ids) declared beneath it */
const OWNER_FIELDS = Object.create(null);
/** category name -> {type:"block"|"template", id} */
const CATEGORY_INDEX = Object.create(null);

function indexLines(lines, meta, fieldBag) {
  (lines || []).forEach(function (line) {
    LINE_INDEX[line.id] = { line: line, ownerType: meta.ownerType, ownerId: meta.ownerId,
                            sectionId: meta.sectionId, sectionName: meta.sectionName };
    collectFieldIds(line, fieldBag);
    if (line.kind === "fork") {
      (line.options || []).forEach(function (o) { indexLines(o.lines, meta, fieldBag); });
    }
  });
}
function collectFieldIds(line, bag) {
  const walk = function (parts) {
    (parts || []).forEach(function (p) {
      if (typeof p === "string") return;
      if (p.f) bag.add(p.f);
      else if (p.c) {
        bag.add(p.id); bag.add(p.id + "__other");
        p.c.forEach(function (o) { if (typeof o === "object" && o.parts) walk(o.parts); });
      } else if (p.g) walk(p.g);
    });
  };
  if (line.kind === "std") walk(line.parts);
  else if (line.kind === "tri") { walk(line.given); walk(line.withheld); }
  else if (line.kind === "esc") { walk(line.normal); walk(line.fired); }
}

function buildIndexes() {
  (DOC.shell && DOC.shell.sections || []).forEach(function (s) {
    const bag = new Set();
    indexLines(s.lines, { ownerType: "shell", ownerId: s.id, sectionId: s.id, sectionName: s.name }, bag);
    OWNER_FIELDS["shell:" + s.id] = bag;
  });
  (DOC.dispositions || []).forEach(function (d) {
    const bag = new Set();
    indexLines(d.lines, { ownerType: "disposition", ownerId: d.id, sectionId: "disp_" + d.id, sectionName: d.name }, bag);
    OWNER_FIELDS["disposition:" + d.id] = bag;
  });
  const indexOwner = function (b, kind) {
    const bag = new Set();
    indexLines(b.lines, { ownerType: kind, ownerId: b.id, sectionId: kind + "_" + b.id, sectionName: b.name }, bag);
    (b.subBlocks || []).forEach(function (sb) {
      indexLines(sb.lines, { ownerType: kind, ownerId: b.id, sectionId: kind + "_" + b.id, sectionName: b.name + " · " + sb.name }, bag);
    });
    OWNER_FIELDS[kind + ":" + b.id] = bag;
    (b.categories || []).forEach(function (cat) { CATEGORY_INDEX[cat] = { type: kind, id: b.id }; });
  };
  Object.keys(DOC.blocks || {}).forEach(function (k) { indexOwner(DOC.blocks[k], "block"); });
  Object.keys(DOC.templates || {}).forEach(function (k) {
    const t = DOC.templates[k];
    indexOwner(t, "template");
    // An addendum-only template is never a category pick (addendum-1 §D).
    if (!t.addendumOnly) CATEGORY_INDEX[t.name] = { type: "template", id: t.id };
  });
}

/* ============================ state ============================ */

/**
 * @returns {Object} a fresh, empty draft
 * `blockIds` is the OWNER STACK: block ids and template ids in the order they were
 * added. The chart is a chronological record — nothing is ever removed from the
 * stack by adding to it (only an explicit user action or a primary-category swap).
 */
function makeDraft(label, unit) {
  return {
    id: uid(), label: label || "Call", unit: unit || "35M1", category: "",
    blockIds: [],
    subs: {}, values: {}, forks: {}, esc: {},
    naSections: {}, ptContactMade: false, disposition: null, polish: null
  };
}
let state = { drafts: [makeDraft("Call")], activeDraft: 0 };
/** UI-only, never persisted */
const ui = { expanders: {}, copyPending: false, polishWarned: false };

function draft() { return state.drafts[state.activeDraft]; }
function val(id) { return draft().values[id]; }

/* ============================ context ============================ */

/**
 * Resolve one stacked owner id against DOC. Block and template ids never collide,
 * so the lookup order also decides the owner's kind.
 * @param {string} id @returns {{owner:Object, kind:"block"|"template"}|null}
 */
function resolveOwner(id) {
  const b = (DOC.blocks || {})[id];
  if (b) return { owner: b, kind: "block" };
  const t = (DOC.templates || {})[id];
  if (t) return { owner: t, kind: "template" };
  return null;
}

/** Everything the assembler and the form renderer need to know about "what is on". */
function context() {
  const d = draft();
  // One stack, both kinds, in add order. Unknown ids (stale drafts) drop out here.
  const owners = d.blockIds.map(resolveOwner).filter(Boolean);
  const blockIds = owners.map(function (o) { return o.owner.id; });
  const doaActive = blockIds.indexOf("doa") >= 0;
  const nonClinical = blockIds.some(function (id) { return id === "nonClinical"; });
  const cancelled = d.disposition === "cancelled";
  const stacked = function (id) { return blockIds.indexOf(id) >= 0; };
  return {
    d: d, unit: d.unit || "", owners: owners, blockIds: blockIds,
    doaActive: doaActive, nonClinical: nonClinical,
    collapse: (cancelled || nonClinical) && !d.ptContactMade,
    cond: {
      female_childbearing: condFemale(d),
      molst_relevant: COND_IDS.molstBlocks.some(stacked) || COND_IDS.molstTemplates.some(stacked),
      loi_relevant: COND_IDS.loiBlocks.some(stacked)
    }
  };
}
function condFemale(d) {
  const sex = String(d.values[COND_IDS.sexField] || "");
  const age = parseInt(String(d.values[COND_IDS.ageField] || ""), 10);
  return /^f/i.test(sex.trim()) && !isNaN(age) && age >= 12 && age <= 55;
}
function condFlag(name) { return !!context().cond[name]; }

/** Is a line eligible to render at all (before value-emptiness rules)? */
function lineEligible(line, ctx) {
  if (line.cond && !ctx.cond[line.cond]) return lineTouched(line, ctx.d);
  if (line.opt) return lineTouched(line, ctx.d);
  return true;
}
/** Does this line hold any user-entered value? (also drives "touched" for opt/cond) */
function lineTouched(line, d) {
  const bag = new Set();
  collectFieldIds(line, bag);
  let hit = false;
  bag.forEach(function (f) { if (nonEmpty(d.values[f])) hit = true; });
  if (line.kind === "tri" && d.values["__tri__" + line.id]) hit = true;
  if (line.kind === "fork" && nonEmpty(d.forks[line.id])) hit = true;
  return hit;
}
function triMode(lineId) { return draft().values["__tri__" + lineId] || "omit"; }
function setTriMode(lineId, mode) { draft().values["__tri__" + lineId] = mode; }
function forkSel(lineId) {
  const v = draft().forks[lineId];
  return Array.isArray(v) ? v : (nonEmpty(v) ? [v] : []);
}

/* ============================ ASSEMBLY (authoritative) ============================ */

/**
 * Render a Part list to narrative text.
 * Literals are verbatim (with the unit token substituted); fills emit their value,
 * or a sentinel-wrapped "___" when required; choices join Oxford-style; a {g} group
 * emits nothing unless one of its inner fills/choices holds a value.
 * @param {Array} parts
 * @param {{ctx:Object, line:Object, sectionId:string, sectionName:string, missing:Array}} c
 * @returns {string} raw text, blanks wrapped in BL0/BL1 sentinels
 */
function renderParts(parts, c) {
  let out = "";
  (parts || []).forEach(function (p) {
    if (typeof p === "string") { out += replaceAllStr(p, UNIT_TOKEN, c.ctx.unit); return; }
    if (p.f) { out += renderFill(p, c); return; }
    if (p.c) { out += renderChoice(p, c); return; }
    if (p.g) { out += partsHaveValue(p.g, c.ctx.d.values) ? renderParts(p.g, c) : ""; return; }
  });
  return out;
}

/** @returns {string} the fill's value, a flagged blank, or "" */
function renderFill(p, c) {
  const v = c.ctx.d.values[p.f];
  if (nonEmpty(v)) return String(v);
  if (p.req) { noteMissing(c, p.f, p.hint); return BL0 + "___" + BL1; }
  return "";
}

/** @returns {string} Oxford-joined selection text, a flagged blank, or "" */
function renderChoice(p, c) {
  const sel = c.ctx.d.values[p.id];
  const picked = p.multi ? (Array.isArray(sel) ? sel : []) : (nonEmpty(sel) ? [sel] : []);
  if (picked.length === 0) {
    if (p.req) { noteMissing(c, p.id, p.hint); return BL0 + "___" + BL1; }
    return "";
  }
  const texts = picked.map(function (lab) { return choiceOptionText(p, lab, c); })
    .filter(function (t) { return t !== ""; });
  if (texts.length === 0 && p.req) { noteMissing(c, p.id, p.hint); return BL0 + "___" + BL1; }
  return oxford(texts);
}
function choiceOptionText(p, lab, c) {
  if (lab === OTHER) {
    const t = c.ctx.d.values[p.id + "__other"];
    if (nonEmpty(t)) return String(t);
    if (p.req) { noteMissing(c, p.id + "__other", "other"); return BL0 + "___" + BL1; }
    return "";
  }
  const o = (p.c || []).find(function (x) { return optLabel(x) === lab; });
  if (!o) return String(lab);
  if (typeof o === "string") return o;
  if (o.parts) return renderParts(o.parts, c);
  return o.label;
}

/** @returns {boolean} does any fill/choice under these parts hold a value? (group activation) */
function partsHaveValue(parts, values) {
  return (parts || []).some(function (p) {
    if (typeof p === "string") return false;
    if (p.f) return nonEmpty(values[p.f]);
    if (p.c) return nonEmpty(values[p.id]) || nonEmpty(values[p.id + "__other"]);
    if (p.g) return partsHaveValue(p.g, values);
    return false;
  });
}

function noteMissing(c, fieldId, hint) {
  c.missing.push({
    lineId: c.line.id, fieldId: fieldId, sectionId: c.sectionId, sectionName: c.sectionName,
    label: (c.line.label || c.line.id) + " — " + fieldTail(fieldId, c.line.id, hint)
  });
}
function fieldTail(fieldId, lineId, hint) {
  let t = fieldId;
  if (lineId && t.indexOf(lineId + "_") === 0) t = t.slice(lineId.length + 1);
  else { const bits = t.split("_"); t = bits.slice(Math.max(1, bits.length - 2)).join(" "); }
  t = replaceAllStr(t, "_", " ").trim();
  if (!t && hint) t = hint;
  return t || fieldId;
}

/**
 * Render one Line into zero or more output lines.
 * @returns {Array<{lineId:string, raw:string, withheld:boolean}>}
 */
function renderLine(line, ctx, sectionId, sectionName, missing) {
  const c = { ctx: ctx, line: line, sectionId: sectionId, sectionName: sectionName, missing: [] };
  const commit = function (rows) {
    if (rows.length) missing.push.apply(missing, c.missing);
    return rows;
  };
  if (!lineEligible(line, ctx)) return [];

  if (line.kind === "fork") {
    const chosen = forkSel(line.id);
    let rows = [];
    chosen.forEach(function (lab) {
      const o = (line.options || []).find(function (x) { return x.label === lab; });
      if (!o) return;
      (o.lines || []).forEach(function (sub) {
        const got = renderLine(sub, ctx, sectionId, sectionName, missing);
        if (got.length && sub.joinPrev && rows.length) got[0].join = true;
        rows = rows.concat(got);
      });
    });
    return rows;
  }

  let raw = "", withheld = false;
  if (line.kind === "std") raw = renderParts(line.parts, c);
  else if (line.kind === "tri") {
    const m = triMode(line.id);
    if (m === "omit") return [];
    withheld = m === "withheld";
    raw = renderParts(m === "given" ? line.given : line.withheld, c);
  } else if (line.kind === "esc") {
    const fired = ctx.d.esc[line.id] === "fired";
    raw = renderParts(fired ? line.fired : line.normal, c);
  }
  if (stripSentinels(raw).trim() === "") return [];
  return commit([{ lineId: line.id, raw: raw, withheld: withheld }]);
}

/**
 * @returns {{id:string,name:string,lines:Array}|null} a rendered section, or null when empty
 * A line marked joinPrev flags its first emitted row to ride the previously RENDERED
 * row of the SAME section (addendum-1 §A); with no previous row it stands alone.
 */
function renderSection(sectionId, sectionName, lines, ctx, missing) {
  let rows = [];
  (lines || []).forEach(function (l) {
    const got = renderLine(l, ctx, sectionId, sectionName, missing);
    if (got.length && l.joinPrev && rows.length) got[0].join = true;
    rows = rows.concat(got);
  });
  if (!rows.length) return null;
  return { id: sectionId, name: sectionName, lines: rows };
}

/** Which shell section does the block slot follow? */
function slotAnchorId() {
  const secs = (DOC.shell && DOC.shell.sections) || [];
  if (DOC.shell && DOC.shell.slotAfter) return DOC.shell.slotAfter;
  const byName = secs.find(function (s) { return /assessment/i.test(s.id) || /assessment/i.test(s.name || ""); });
  if (byName) return byName.id;
  return secs.length > 3 ? secs[3].id : (secs.length ? secs[secs.length - 1].id : null);
}

/**
 * Assemble the block slot: every stacked owner — block or template — in add order.
 * Fired escalation lines whose owning block is no longer stacked are carried in as
 * the first lines of the slot (see return summary: "fired line survives the swap").
 * Escalation only ever APPENDS, so this net now fires solely after a primary-category
 * swap dropped the owner that held the fired line.
 * @returns {Array<Object>} sections
 */
function assembleSlot(ctx, missing) {
  const d = ctx.d;
  let sections = [];
  ctx.owners.forEach(function (o) {
    sections = sections.concat(ownerSections(o.owner, o.kind, ctx, missing));
  });

  const activeOwners = ctx.blockIds;
  const orphanRows = [];
  Object.keys(d.esc).forEach(function (lineId) {
    if (d.esc[lineId] !== "fired") return;
    const rec = LINE_INDEX[lineId];
    if (!rec || activeOwners.indexOf(rec.ownerId) >= 0) return;
    const rows = renderLine(rec.line, ctx, rec.sectionId, rec.sectionName, missing);
    orphanRows.push.apply(orphanRows, rows);
  });
  if (orphanRows.length) {
    if (sections.length) sections[0].lines = orphanRows.concat(sections[0].lines);
    else sections.push({ id: "slot_esc", name: "Escalation", lines: orphanRows });
  }
  return sections;
}

/**
 * A block/template renders each active sub-block, then its own block-level lines.
 * Sub-blocks come first because a block that HAS sub-blocks keeps only its tail
 * material (the escalation line) at block level — see return summary.
 * An escalation addendum is just another stacked owner behind its host, so it comes
 * through here on its own — there is no combined host+addendum section.
 * @returns {Array<Object>} one section per sub-block plus one for the block itself
 */
function ownerSections(owner, kind, ctx, missing) {
  const out = [];
  (owner.subBlocks || []).forEach(function (sb) {
    if (!subActive(owner, sb)) return;
    const s = renderSection(kind + "_" + owner.id + "_" + sb.id, owner.name + " · " + sb.name,
      sb.lines, ctx, missing);
    if (s) out.push(s);
  });
  const own = renderSection(kind + "_" + owner.id, owner.name, owner.lines, ctx, missing);
  if (own) out.push(own);
  // Paragraph break between sub-blocks is the default; a block may declare
  // subBlockJoin:"line" to run everything together as one paragraph instead.
  if (owner.subBlockJoin === "line" && out.length > 1) {
    const merged = { id: kind + "_" + owner.id, name: owner.name, lines: [] };
    out.forEach(function (s) { merged.lines = merged.lines.concat(s.lines); });
    return [merged];
  }
  return out;
}
function subActive(owner, sb) {
  const sel = draft().subs[owner.id];
  if (!sel) return owner.subBlocks[0] === sb;   // default: first sub-block
  return sel.indexOf(sb.id) >= 0;
}

/**
 * THE traversal. Every consumer (preview HTML, copy text, char count, missing list,
 * click-to-jump) derives from this one structure so they can never disagree.
 * @param {Object} ctx
 * @returns {{sections:Array<{id,name,lines:Array<{lineId,raw,withheld}>}>, missing:Array}}
 */
function assemble(ctx) {
  const missing = [];
  const sections = [];
  const shellSecs = (DOC.shell && DOC.shell.sections) || [];
  const anchor = slotAnchorId();
  let slotPlaced = false;

  shellSecs.forEach(function (s) {
    const collapsed = hasBehavior(s, "cancelled-collapse") && ctx.collapse;
    const na = ctx.doaActive && hasBehavior(s, "doa-na") && ctx.d.naSections[s.id];
    if (!collapsed && !na) {
      const sec = renderSection(s.id, s.name, s.lines, ctx, missing);
      if (sec) sections.push(sec);
    }
    if (s.id === anchor) {
      assembleSlot(ctx, missing).forEach(function (x) { sections.push(x); });
      slotPlaced = true;
    }
  });
  if (!slotPlaced) assembleSlot(ctx, missing).forEach(function (x) { sections.push(x); });

  // DOA block replaces the disposition entirely (doc §14).
  if (!ctx.doaActive && ctx.d.disposition) {
    const dsp = (DOC.dispositions || []).find(function (x) { return x.id === ctx.d.disposition; });
    if (dsp) {
      const sec = renderSection("disp_" + dsp.id, dsp.name, dsp.lines, ctx, missing);
      if (sec) sections.push(sec);
    }
  }
  return { sections: sections, missing: missing };
}

/**
 * Concatenate one section's rows. A row flagged `join` (line-level joinPrev) rides the
 * previously EMITTED row with a single space; everything else gets a hard return.
 * Both text and HTML go through this so copy and preview can never disagree.
 * @param {Array} rows @param {function(Object):string} paint @returns {string}
 */
function joinRows(rows, paint) {
  let out = "";
  (rows || []).forEach(function (l) {
    const t = paint(l);
    if (t === "") return;
    if (out === "") { out = t; return; }   // nothing emitted yet: joinPrev stands alone
    out += (l.join ? " " : "\n") + t;
  });
  return out;
}

/** @returns {string} the narrative exactly as it will be pasted (no sentinels) */
function assemblyText(asm) {
  return asm.sections.map(function (s) {
    return joinRows(s.lines, function (l) { return stripSentinels(l.raw); });
  }).filter(function (t) { return t !== ""; }).join("\n\n");
}

/** @returns {string} preview HTML: one span per line, blanks and withheld marked */
function assemblyHtml(asm) {
  return asm.sections.map(function (s) {
    return joinRows(s.lines, function (l) {
      const body = replaceAllStr(replaceAllStr(esc(l.raw), esc(BL0), '<span class="pv-blank">'),
        esc(BL1), "</span>");
      return '<span class="pv-line' + (l.withheld ? " pv-withheld" : "") +
        '" data-line="' + esc(l.lineId) + '">' + body + "</span>";
    });
  }).filter(function (t) { return t !== ""; }).join("\n\n");
}

/** emsCharts counts a hard return as two characters. */
function charCount(text) {
  const nl = text.match(/\n/g);
  return text.length + (nl ? nl.length : 0);
}

/* ============================ FORM RENDERING ============================ */

function renderAll() {
  renderTopbar();
  renderForm();
  renderPreview();
  scheduleSave();
}

function renderTopbar() {
  const d = draft();
  const us = document.getElementById("unit-select");
  const uo = document.getElementById("unit-other");
  const known = Array.prototype.slice.call(us.options)
    .some(function (o) { return o.value === d.unit; });
  if (known) { us.value = d.unit; uo.hidden = true; }
  else { us.value = OTHER; uo.hidden = false; uo.value = d.unit; }

  const cs = document.getElementById("category-select");
  if (!cs.dataset.built) {
    cs.appendChild(new Option("— pick a category —", ""));
    const g1 = el("optgroup"); g1.label = "Dispatch categories";
    Object.keys(CATEGORY_INDEX).filter(function (name) { return CATEGORY_INDEX[name].type === "block"; })
      .sort(function (a, b) { return a.localeCompare(b); })
      .forEach(function (name) { g1.appendChild(new Option(name, name)); });
    const g2 = el("optgroup"); g2.label = "Direct templates";
    Object.keys(DOC.templates || {}).forEach(function (k) {
      const t = DOC.templates[k];
      if (t.addendumOnly) return;          // reachable only as an escalation addendum
      g2.appendChild(new Option(t.name, t.name));
    });
    cs.appendChild(g1); cs.appendChild(g2);
    cs.dataset.built = "1";
  }
  cs.value = d.category || "";

  const sw = document.getElementById("draft-switcher");
  sw.innerHTML = "";
  sw.hidden = state.drafts.length < 2;
  state.drafts.forEach(function (dr, i) {
    const b = el("button", "draft-tab" + (i === state.activeDraft ? " active" : ""), dr.label);
    b.type = "button";
    b.addEventListener("click", function () {
      state.activeDraft = i; ui.polishWarned = false; renderAll();
    });
    sw.appendChild(b);
  });
}

function renderForm() {
  const ctx = context();
  const top = document.getElementById("shell-top");
  const slot = document.getElementById("block-slot");
  const bot = document.getElementById("shell-bottom");
  top.innerHTML = ""; slot.innerHTML = ""; bot.innerHTML = "";

  const anchor = slotAnchorId();
  let target = top;
  ((DOC.shell && DOC.shell.sections) || []).forEach(function (s) {
    target.appendChild(shellCard(s, ctx));
    if (s.id === anchor) target = bot;
  });

  // form order mirrors assembly order: one card per stacked owner, in add order
  ctx.owners.forEach(function (o) { slot.appendChild(ownerCard(o.owner, o.kind, ctx)); });

  renderDisposition(ctx);
  syncCondPlacement();
}

function cardShell(id, name) {
  const card = el("div", "section-card");
  card.dataset.section = id;
  const head = el("div", "card-head");
  head.appendChild(el("span", "card-title", name));
  const tools = el("span", "card-tools");
  head.appendChild(tools);
  const body = el("div", "card-body");
  const lines = el("div", "lines");
  const exp = el("div", "expander");
  const expBtn = el("button", "expander-toggle", "+ add detail");
  expBtn.type = "button";
  const expBody = el("div", "expander-body");
  expBody.hidden = !ui.expanders[id];
  expBtn.addEventListener("click", function () {
    ui.expanders[id] = !ui.expanders[id];
    expBody.hidden = !ui.expanders[id];
  });
  exp.appendChild(expBtn); exp.appendChild(expBody);
  body.appendChild(lines); body.appendChild(exp);
  card.appendChild(head); card.appendChild(body);
  card._lines = lines; card._exp = expBody; card._expWrap = exp; card._tools = tools; card._body = body;
  return card;
}

/** Section-level `note` is doc guidance: helper text in the card, never in output. */
function sectionNote(card, s) {
  if (!s.note) return;
  card._body.insertBefore(el("div", "card-note", s.note), card._body.firstChild);
}

function shellCard(s, ctx) {
  const card = cardShell(s.id, s.name);
  const d = ctx.d;

  if (hasBehavior(s, "cancelled-collapse") && ctx.collapse) {
    card.classList.add("collapsed");
    card._body.innerHTML = "";
    sectionNote(card, s);
    const lbl = el("label", "pt-contact");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!d.ptContactMade;
    cb.addEventListener("change", function () { d.ptContactMade = cb.checked; structuralEdit(); });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(" pt contact made"));
    card._body.appendChild(lbl);
    return card;
  }
  if (ctx.doaActive && hasBehavior(s, "doa-na")) {
    const btn = el("button", "na-toggle" + (d.naSections[s.id] ? " on" : ""), "N/A");
    btn.type = "button";
    btn.addEventListener("click", function () {
      if (d.naSections[s.id]) delete d.naSections[s.id]; else d.naSections[s.id] = true;
      structuralEdit();
    });
    card._tools.appendChild(btn);
    if (d.naSections[s.id]) card.classList.add("na");
  }
  sectionNote(card, s);
  fillCardLines(card, s.lines, ctx);
  return card;
}

/** One card per stacked owner — blocks and templates render identically. */
function ownerCard(owner, kind, ctx) {
  const card = cardShell(kind + "_" + owner.id, owner.name);
  const x = el("button", "rm-block", "×");
  x.type = "button"; x.title = "remove " + kind;
  x.addEventListener("click", function () { removeBlock(owner.id); });
  card._tools.appendChild(x);
  if (owner.intro) card._lines.appendChild(el("div", "card-intro", owner.intro));

  if (owner.subBlocks && owner.subBlocks.length) {
    const row = el("div", "sub-row");
    const multi = owner.subBlocks.some(function (sb) { return sb.multi; });
    owner.subBlocks.forEach(function (sb) {
      const on = subActive(owner, sb);
      const b = el("button", "sub-pill" + (on ? " on" : ""), sb.name);
      b.type = "button";
      b.addEventListener("click", function () { toggleSub(owner, sb, multi); });
      row.appendChild(b);
    });
    card._lines.appendChild(row);
  }

  // form order mirrors assembly order: sub-blocks first, then block-level lines
  (owner.subBlocks || []).forEach(function (sb) {
    if (!subActive(owner, sb)) return;
    const grp = el("div", "sub-group");
    grp.appendChild(el("div", "sub-head", sb.name));
    const host = card._lines;           // borrow the card so _idx / _exp stay shared
    card._lines = grp;
    fillCardLines(card, sb.lines, ctx);
    card._lines = host;
    host.appendChild(grp);
  });
  fillCardLines(card, owner.lines, ctx);

  if (owner.handoff) maybeHandoffButton(card, owner, ctx);
  return card;
}

function fillCardLines(card, lines, ctx) {
  // idx continues across calls on the same card so that lines from different
  // sub-blocks keep their document order inside the SHARED expander
  if (card._idx == null) card._idx = 0;
  (lines || []).forEach(function (line) {
    const node = lineNode(line, ctx);
    node.dataset.idx = String(card._idx++);
    const deferred = (line.cond && !ctx.cond[line.cond] && !lineTouched(line, ctx.d)) ||
      (line.opt && !lineTouched(line, ctx.d));
    (deferred ? card._exp : card._lines).appendChild(node);
  });
  if (card._expWrap) card._expWrap.hidden = card._exp.children.length === 0;
}

function lineNode(line, ctx) {
  const node = el("div", "line line-" + line.kind);
  node.dataset.line = line.id;
  if (line.cond) node.dataset.cond = line.cond;
  if (line.opt) node.dataset.opt = "1";
  const head = el("div", "line-head");
  head.appendChild(el("span", "line-label", line.label || line.id));
  node.appendChild(head);

  if (line.kind === "tri") {
    const mode = triMode(line.id);
    head.appendChild(segmented(
      [{ v: "given", t: "given" }, { v: "withheld", t: withheldWord(line) }, { v: "omit", t: "omit" }],
      mode, "tri", function (v) { setTriMode(line.id, v); replaceLineNode(line.id); }));
    if (mode !== "omit") {
      const body = el("div", "line-inputs");
      partsNodes(mode === "given" ? line.given : line.withheld, line, ctx, body);
      node.appendChild(body);
    }
  } else if (line.kind === "esc") {
    const fired = ctx.d.esc[line.id] === "fired";
    head.appendChild(segmented(
      [{ v: "normal", t: "not fired" }, { v: "fired", t: "FIRED" }],
      fired ? "fired" : "normal", "esc", function (v) {
        if (v === "fired") askEscalate(line);
        else { delete ctx.d.esc[line.id]; structuralEdit(); }
      }));
    if (line.escalatesTo) head.appendChild(el("span", "line-hint", line.escalatesTo));
    const body = el("div", "line-inputs");
    partsNodes(fired ? line.fired : line.normal, line, ctx, body);
    node.appendChild(body);
  } else if (line.kind === "fork") {
    const sel = forkSel(line.id);
    const row = el("div", "fork-row");
    (line.options || []).forEach(function (o) {
      const on = sel.indexOf(o.label) >= 0;
      const b = el("button", "pill" + (on ? " on" : ""), o.label);
      b.type = "button";
      b.addEventListener("click", function () {
        if (line.multi) {
          const next = sel.slice();
          const i = next.indexOf(o.label);
          if (i >= 0) next.splice(i, 1); else next.push(o.label);
          ctx.d.forks[line.id] = next;
        } else {
          ctx.d.forks[line.id] = sel.indexOf(o.label) >= 0 ? "" : o.label;
        }
        structuralEdit();
      });
      row.appendChild(b);
    });
    node.appendChild(row);
    const subs = el("div", "fork-lines");
    sel.forEach(function (lab) {
      const o = (line.options || []).find(function (x) { return x.label === lab; });
      if (!o) return;
      (o.lines || []).forEach(function (sub) { subs.appendChild(lineNode(sub, ctx)); });
    });
    node.appendChild(subs);
  } else {
    const body = el("div", "line-inputs");
    partsNodes(line.parts, line, ctx, body);
    node.appendChild(body);
  }
  if (line.note) node.appendChild(el("div", "line-note", line.note));
  return node;
}

function withheldWord(line) {
  const first = (line.withheld || [])[0];
  if (typeof first === "string" && /not indicated/i.test(first)) return "not indicated";
  return "withheld";
}

/** Rebuild one line's DOM in place — used for tri / choice / structural-within-line edits. */
function replaceLineNode(lineId) {
  const old = document.querySelector('#form-pane .line[data-line="' + cssEsc(lineId) + '"]');
  if (!old) { renderAll(); return; }
  const rec = LINE_INDEX[lineId];
  if (!rec) { renderAll(); return; }
  const fresh = lineNode(rec.line, context());
  fresh.dataset.idx = old.dataset.idx || "0";
  old.parentNode.replaceChild(fresh, old);
  syncCondPlacement();
  if (draft().polish) { warnPolish(); scheduleSave(); return; }
  renderPreview(); scheduleSave();
}
function cssEsc(s) { return String(s).replace(/["\\]/g, "\\$&"); }

function segmented(opts, current, cls, onPick) {
  const wrap = el("div", "seg seg-" + cls);
  opts.forEach(function (o) {
    const b = el("button", "seg-btn" + (o.v === current ? " on seg-" + o.v : ""), o.t);
    b.type = "button";
    b.addEventListener("click", function () { onPick(o.v); });
    wrap.appendChild(b);
  });
  return wrap;
}

function partsNodes(parts, line, ctx, host) {
  (parts || []).forEach(function (p) {
    if (typeof p === "string") {
      const lit = el("span", "lit", replaceAllStr(p, UNIT_TOKEN, ctx.unit));
      if (p.indexOf(UNIT_TOKEN) >= 0) lit.dataset.lit = p;   // re-substitutable on unit change
      host.appendChild(lit);
      return;
    }
    if (p.f) { host.appendChild(fillInput(p, line)); return; }
    if (p.c) { choiceNodes(p, line, ctx, host); return; }
    if (p.g) {
      const g = el("span", "grp");
      partsNodes(p.g, line, ctx, g);
      host.appendChild(g);
      return;
    }
  });
}

function fillInput(p, line) {
  const wrap = el("span", "fld");
  const isHosp = p.w === "hospital";
  const input = document.createElement("input");
  input.type = "text";
  input.dataset.field = p.f;
  input.dataset.line = line.id;
  if (p.hint) { input.placeholder = p.hint; input.title = p.hint; }
  if (p.req) input.classList.add("req");
  const v = val(p.f);
  input.value = nonEmpty(v) ? String(v) : "";
  if (isHosp) {
    const listId = "dl_" + p.f;
    input.setAttribute("list", listId);
    input.style.width = W_MAP[16];
    const dl = document.createElement("datalist");
    dl.id = listId;
    HOSPITALS.forEach(function (h) { dl.appendChild(new Option(h, h)); });
    wrap.appendChild(dl);
  } else {
    input.style.width = W_MAP[p.w] || W_MAP[8];
  }
  if (isTimeField(p)) {
    input.classList.add("time");
    input.inputMode = "numeric";
    input.setAttribute("pattern", "\\d{4}");
    input.maxLength = 4;
  }
  input.addEventListener("input", function () {
    setValue(p.f, input.value);
    if (input.classList.contains("time")) markTime(input);
  });
  if (input.classList.contains("time")) markTime(input);
  wrap.appendChild(input);
  return wrap;
}

/** Soft clock validation — red outline only, never blocks. */
function markTime(input) {
  const v = input.value.trim();
  let bad = false;
  if (v !== "") {
    if (!/^\d{4}$/.test(v)) bad = true;
    else {
      const h = +v.slice(0, 2), m = +v.slice(2);
      bad = h > 23 || m > 59;
    }
  }
  input.classList.toggle("bad", bad);
}

function choiceNodes(p, line, ctx, host) {
  const opts = (p.c || []).map(optLabel);
  if (p.other) opts.push(OTHER);
  const sel = ctx.d.values[p.id];
  const picked = p.multi ? (Array.isArray(sel) ? sel : []) : (nonEmpty(sel) ? [sel] : []);
  const labelOf = function (o) { return o === OTHER ? "other…" : o; };

  if (p.multi) {
    const row = el("span", "chips");
    opts.forEach(function (o) {
      const on = picked.indexOf(o) >= 0;
      const b = el("button", "chip" + (on ? " on" : ""), labelOf(o));
      b.type = "button";
      b.dataset.field = p.id; b.dataset.line = line.id;
      b.addEventListener("click", function () {
        const next = picked.slice();
        const i = next.indexOf(o);
        if (i >= 0) next.splice(i, 1); else next.push(o);
        setValue(p.id, next);
        replaceLineNode(line.id);
      });
      row.appendChild(b);
    });
    host.appendChild(row);
  } else if (opts.length > 4) {
    const s = document.createElement("select");
    s.dataset.field = p.id; s.dataset.line = line.id;
    s.appendChild(new Option("—", ""));
    opts.forEach(function (o) { s.appendChild(new Option(labelOf(o), o)); });
    s.value = picked[0] || "";
    s.addEventListener("change", function () { setValue(p.id, s.value); replaceLineNode(line.id); });
    host.appendChild(s);
  } else {
    const row = el("span", "pills");
    opts.forEach(function (o) {
      const on = picked.indexOf(o) >= 0;
      const b = el("button", "pill" + (on ? " on" : ""), labelOf(o));
      b.type = "button";
      b.dataset.field = p.id; b.dataset.line = line.id;
      b.addEventListener("click", function () {
        setValue(p.id, picked.indexOf(o) >= 0 ? "" : o);
        replaceLineNode(line.id);
      });
      row.appendChild(b);
    });
    host.appendChild(row);
  }

  if (picked.indexOf(OTHER) >= 0) {
    const other = document.createElement("input");
    other.type = "text";
    other.className = "other-input";
    other.dataset.field = p.id + "__other";
    other.dataset.line = line.id;
    other.placeholder = "other…";
    other.style.width = W_MAP[16];
    const ov = ctx.d.values[p.id + "__other"];
    other.value = nonEmpty(ov) ? String(ov) : "";
    other.addEventListener("input", function () { setValue(p.id + "__other", other.value); });
    host.appendChild(other);
  }
  // Options that carry their own embedded blanks reveal them when selected.
  (p.c || []).forEach(function (o) {
    if (typeof o === "string" || !o.parts) return;
    if (picked.indexOf(o.label) < 0) return;
    const det = el("span", "opt-detail");
    partsNodes(o.parts, line, ctx, det);
    host.appendChild(det);
  });
}

function renderDisposition(ctx) {
  const card = document.getElementById("disposition-card");

/** Move cond lines between the section body and its "+ add detail" expander in place. */
function syncCondPlacement() {
  const ctx = context();
  document.querySelectorAll("#form-pane .section-card").forEach(function (card) {
    const lines = card.querySelector(":scope > .card-body > .lines");
    const exp = card.querySelector(":scope > .card-body > .expander > .expander-body");
    const wrap = card.querySelector(":scope > .card-body > .expander");
    if (!lines || !exp) return;
    const nodes = [].concat(
      Array.prototype.slice.call(lines.children),
      Array.prototype.slice.call(exp.children));
    nodes.forEach(function (node) {
      if (!node.dataset || !node.dataset.line) return;
      const rec = LINE_INDEX[node.dataset.line];
      if (!rec) return;
      const line = rec.line;
      if (!line.cond && !line.opt) return;
      const touched = lineTouched(line, ctx.d);
      const shown = touched || (line.cond ? !!ctx.cond[line.cond] : false);
      const want = shown ? lines : exp;
      if (node.parentNode !== want) insertOrdered(want, node);
    });
    if (wrap) wrap.hidden = exp.children.length === 0;
  });
}
/** Re-substitute the unit token in already-rendered literal spans. */
function repaintUnitLiterals() {
  const unit = draft().unit || "";
  document.querySelectorAll("#form-pane .lit[data-lit]").forEach(function (n) {
    n.textContent = replaceAllStr(n.dataset.lit, UNIT_TOKEN, unit);
  });
}

function insertOrdered(container, node) {
  const idx = +(node.dataset.idx || 0);
  const before = Array.prototype.slice.call(container.children).find(function (k) {
    return +(k.dataset.idx || 0) > idx;
  });
  container.insertBefore(node, before || null);
}

/* ============================ value plumbing ============================ */

function setValue(id, v) {
  const d = draft();
  if (Array.isArray(v)) { if (v.length) d.values[id] = v; else delete d.values[id]; }
  else if (nonEmpty(v)) d.values[id] = v;
  else delete d.values[id];
  onFormEdit();
}

/** Called after a VALUE change: no form rebuild (caret/focus preserved). */
function onFormEdit() {
  syncCondPlacement();
  if (draft().polish) { warnPolish(); scheduleSave(); return; }
  renderPreview();
  scheduleSave();
}

/** Called after a STRUCTURAL change the user made: full form rebuild + polish guard. */
function structuralEdit() {
  if (draft().polish) warnPolish();
  renderAll();
}

/* ============================ PREVIEW ============================ */

let lastAsm = null;

function renderPreview() {
  const ctx = context();
  const asm = assemble(ctx);
  lastAsm = asm;
  const pv = document.getElementById("preview");
  const d = draft();

  if (d.polish) {
    pv.classList.add("polishing");
    pv.setAttribute("contenteditable", "true");
    // live sync paused: never overwrite the buffer while the SAME draft is editing,
    // but a draft switch must repaint the incoming draft's own buffer
    if (pv.dataset.draftId !== d.id) pv.textContent = d.polish.text;
  } else {
    pv.classList.remove("polishing");
    pv.removeAttribute("contenteditable");
    pv.innerHTML = assemblyHtml(asm);
  }
  pv.dataset.draftId = d.id;
  updateCounter(currentText());
  renderMissing(asm.missing);
  document.getElementById("polish-banner").hidden = !d.polish;
  document.getElementById("polish-toggle").textContent = d.polish ? "Exit polish" : "Polish";
}

/** @returns {string} what Copy would put on the clipboard right now */
function currentText() {
  const d = draft();
  if (d.polish) return d.polish.text;
  return assemblyText(lastAsm || assemble(context()));
}

function updateCounter(text) {

  const c = document.getElementById("char-counter");
  const w = document.getElementById("char-warning");
  c.textContent = String(n);
  c.classList.toggle("amber", n >= CHAR_AMBER && n < CHAR_RED);
  c.classList.toggle("red", n >= CHAR_RED);
  if (n >= CHAR_RED) { w.hidden = false; w.textContent = CHAR_RED_MSG; }
  else w.hidden = true;
}

function renderMissing(missing) {
  const badge = document.getElementById("missing-badge");
  const list = document.getElementById("missing-list");
  const n = missing.length;
  badge.hidden = n === 0;
  badge.textContent = n + " missing";
  list.innerHTML = "";
  list.hidden = n === 0;
  const groups = [];
  missing.forEach(function (m) {
    let g = groups.find(function (x) { return x.id === m.sectionId; });
    if (!g) { g = { id: m.sectionId, name: m.sectionName, rows: [] }; groups.push(g); }
    g.rows.push(m);
  });
  groups.forEach(function (g) {
    const box = el("div", "ml-group");
    box.appendChild(el("div", "ml-head", g.name || g.id));
    g.rows.forEach(function (m) {
      const b = el("button", "ml-row", m.label);
      b.type = "button";
      b.dataset.field = m.fieldId;
      b.addEventListener("click", function () { jumpToField(m.fieldId, m.lineId); });
      box.appendChild(b);
    });
    list.appendChild(box);
  });
  const copy = document.getElementById("copy-btn");
  copy.textContent = n > 0 ? "Copy (" + n + " ___)" : "Copy";

/* ---- click-to-jump (both directions) ---- */

function revealAncestors(node) {
  let p = node;
  while (p && p !== document.body) {
    if (p.classList && p.classList.contains("expander-body") && p.hidden) {
      p.hidden = false;
      const card = p.closest(".section-card");
      if (card && card.dataset.section) ui.expanders[card.dataset.section] = true;
    }
    if (p.hidden) p.hidden = false;
    p = p.parentNode;
  }
}
function focusNode(node) {
  if (!node) return;
  revealAncestors(node);
  node.scrollIntoView({ block: "center", behavior: "smooth" });
  if (typeof node.focus === "function") node.focus({ preventScroll: true });
  const line = node.closest ? node.closest(".line") : null;
  if (line) {
    line.classList.add("flash");
    setTimeout(function () { line.classList.remove("flash"); }, 900);
  }
}
function jumpToField(fieldId, lineId) {
  let n = document.querySelector('#form-pane [data-field="' + cssEsc(fieldId) + '"]');
  if (!n && lineId) n = firstInputOfLine(lineId);
  focusNode(n);
}
function firstInputOfLine(lineId) {
  const line = document.querySelector('#form-pane .line[data-line="' + cssEsc(lineId) + '"]');
  if (!line) return null;
  return line.querySelector("input, select, button, [contenteditable]") || line;
}
function jumpToLine(lineId) { focusNode(firstInputOfLine(lineId)); }

/* ============================ structural actions ============================ */

/**
 * A category pick sets the PRIMARY owner (block or template) at index 0 and keeps
 * every manually stacked extra behind it. Swapping the primary is a correction of
 * what the call was, not a deletion of charted material.
 */
function pickCategory(name) {
  const d = draft();
  d.category = name;
  const hit = CATEGORY_INDEX[name];
  if (!hit) { renderAll(); return; }
  // index 0 is the primary owner; manually stacked extras are preserved after it
  const extras = d.blockIds.slice(1).filter(function (id) { return id !== hit.id; });
  d.blockIds = [hit.id].concat(extras);
  seedSubs(hit.id);
  structuralEdit();
}
function seedSubs(blockId) {
  const b = (DOC.blocks || {})[blockId];
  const d = draft();
  if (b && b.subBlocks && b.subBlocks.length && !d.subs[blockId]) d.subs[blockId] = [b.subBlocks[0].id];
}
/**
 * Append an owner id to the stack if it is not already there. Never replaces.
 * @param {Object} d the ACTIVE draft — seedSubs resolves draft() on its own, so
 *   this must not be called with a draft that is not currently selected.
 * @param {string} id block or template id
 */
function pushOwner(d, id) {
  if (d.blockIds.indexOf(id) < 0) d.blockIds.push(id);
  seedSubs(id);
}
function addBlock(id) {
  pushOwner(draft(), id);
  structuralEdit();
}
function blockHasValues(id) {
  const bag = OWNER_FIELDS["block:" + id] || OWNER_FIELDS["template:" + id];
  const d = draft();
  if (!bag) return false;
  let hit = false;
  bag.forEach(function (f) { if (nonEmpty(d.values[f])) hit = true; });
  return hit;
}
function removeBlock(id) {
  const drop = function () {
    const d = draft();
    d.blockIds = d.blockIds.filter(function (x) { return x !== id; });
    delete d.subs[id];
    structuralEdit();
  };
  if (!blockHasValues(id)) { drop(); return; }
  openModal({
    title: "Remove block?",
    body: "This block has entered values. Removing it drops them from the narrative.",
    actions: [{ label: "Cancel", cls: "quiet" }, { label: "Remove", cls: "danger", onClick: drop }]
  });
}
function toggleSub(owner, sb, multi) {
  const d = draft();
  const cur = d.subs[owner.id] || [owner.subBlocks[0].id];
  let next;
  if (multi) {
    next = cur.slice();
    const i = next.indexOf(sb.id);
    if (i >= 0) next.splice(i, 1); else next.push(sb.id);
  } else next = [sb.id];
  d.subs[owner.id] = next;
  structuralEdit();
}

/* ---- escalation ---- */

function askEscalate(line) {
  const targets = line.targets || [];
  if (!targets.length) { draft().esc[line.id] = "fired"; renderAll(); return; }
  let choice = targets[0];
  const body = el("div");
  body.appendChild(el("p", null, "Add " + choice.label + " after this block? Entered values carry over."));
  if (targets.length > 1) {
    const row = el("div", "modal-pills");
    const btns = targets.map(function (t) {
      const b = el("button", "pill" + (t === choice ? " on" : ""), t.label);
      b.type = "button";
      b.addEventListener("click", function () {
        choice = t;
        Array.prototype.forEach.call(row.children, function (c, i) {
          c.classList.toggle("on", targets[i] === choice);
        });
        body.firstChild.textContent = "Add " + choice.label + " after this block? Entered values carry over.";
      });
      return b;
    });
    btns.forEach(function (b) { row.appendChild(b); });
    body.appendChild(row);
  }
  openModal({
    title: "Escalation",
    bodyNode: body,
    actions: [
      { label: "Cancel", cls: "quiet" },            // cancel: state untouched, pill reverts on re-render
      { label: "Add", cls: "primary", onClick: function () { doEscalate(line, choice); } }
    ],
    onClose: function () { renderAll(); }
  });
}

/**
 * Apply an escalation: mark fired, copy carry values, APPEND the target owner.
 * The chart is chronological — the source block stays exactly where it is and keeps
 * rendering ahead of the target. Target kind is irrelevant here: block ids and
 * template ids share one stack.
 */
function doEscalate(line, target) {
  const d = draft();
  d.esc[line.id] = "fired";
  const carry = line.carry || {};
  Object.keys(carry).forEach(function (src) {
    // "=fieldId": "literal" sets a constant on the target (e.g. a status choice
    // the source block implies but has no field for)
    if (src.charAt(0) === "=") { d.values[src.slice(1)] = carry[src]; return; }
    if (nonEmpty(d.values[src])) d.values[carry[src]] = d.values[src];
  });
  pushOwner(d, target.id);
  // A target may pull an addendum template in behind it — stacked, in that order.
  if (target.addendum) pushOwner(d, target.addendum);
  structuralEdit();
}

/* ---- OB infant hand-off ---- */

function maybeHandoffButton(card, owner, ctx) {
  const h = owner.handoff;
  if (!h) return;
  if (h.whenFork) {
    const sel = forkSel(h.whenFork.lineId);
    if (sel.indexOf(h.whenFork.option) < 0) return;
  }
  const b = el("button", "handoff-btn", h.buttonLabel || "Start second narrative");
  b.type = "button";
  b.addEventListener("click", function () { startHandoff(owner); });
  card._lines.appendChild(b);
}

/** Create a second draft carrying the declared values. Source draft untouched. */
function startHandoff(owner) {
  const h = owner.handoff;
  const src = draft();
  const nd = makeDraft(h.newLabel || "Infant", src.unit);
  nd.category = h.category || src.category;
  const hit = CATEGORY_INDEX[nd.category];
  if (hit) nd.blockIds = [hit.id];        // primary owner, block or template alike
  Object.keys(h.carry || {}).forEach(function (s) {
    if (nonEmpty(src.values[s])) nd.values[h.carry[s]] = src.values[s];
  });
  if (nd.blockIds.length) {
    const b = (DOC.blocks || {})[nd.blockIds[0]];
    if (b && b.subBlocks && b.subBlocks.length) nd.subs[nd.blockIds[0]] = [b.subBlocks[0].id];
  }
  state.drafts.push(nd);
  state.activeDraft = state.drafts.length - 1;
  ui.polishWarned = false;
  renderAll();
}

/* ============================ polish mode ============================ */

function togglePolish() {
  const d = draft();
  if (d.polish) { d.polish = null; ui.polishWarned = false; renderAll(); return; }
  const text = assemblyText(lastAsm || assemble(context()));

function warnPolish() {

/* ============================ copy ============================ */

function doCopy() {
  const btn = document.getElementById("copy-btn");
  const missingN = (lastAsm && lastAsm.missing.length) || 0;
  if (missingN > 0 && !ui.copyPending && !draft().polish) {
    ui.copyPending = true;
    btn.textContent = "Copy with " + missingN + " unfilled ___?";
    btn.classList.add("confirming");
    setTimeout(function () {
      if (!ui.copyPending) return;
      ui.copyPending = false;
      btn.classList.remove("confirming");
      btn.textContent = "Copy (" + missingN + " ___)";
    }, 6000);
    return;
  }
  ui.copyPending = false;
  btn.classList.remove("confirming");
  const text = currentText();
  const done = function () {
    setStatus("copied");
    btn.textContent = "Copied ✓";
    setTimeout(function () { renderPreview(); }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
  } else legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) { done(); return; }
  setStatus("copy failed — select the preview and copy manually");
  renderPreview();                       // restore the button's normal label
}

/* ============================ modal ============================ */

function openModal(cfg) {
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  root.hidden = false;
  const card = el("div", "modal-card");
  card.appendChild(el("div", "modal-title", cfg.title || ""));
  const body = el("div", "modal-body");
  if (cfg.bodyNode) body.appendChild(cfg.bodyNode);
  else body.appendChild(el("p", null, cfg.body || ""));
  card.appendChild(body);
  const row = el("div", "modal-actions");
  const close = function () {
    root.hidden = true; root.innerHTML = "";
    document.removeEventListener("keydown", onKey);
    if (cfg.onClose) cfg.onClose();
  };
  (cfg.actions || [{ label: "OK", cls: "primary" }]).forEach(function (a) {
    const b = el("button", "modal-btn " + (a.cls || ""), a.label);
    b.type = "button";
    b.addEventListener("click", function () {
      close();
      if (a.onClick) a.onClick();
    });
    row.appendChild(b);
  });
  card.appendChild(row);
  root.appendChild(card);
  root.addEventListener("click", function (e) { if (e.target === root) close(); }, { once: true });
  const onKey = function (e) { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const first = row.querySelector("button");
  if (first) first.focus();
}

/* ============================ persistence (sessionStorage ONLY) ============================ */

let saveTimer = null;
function scheduleSave() {
  setStatus("editing…");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}
function saveNow() {
  try {
    sessionStorage.setItem(SS_KEY, JSON.stringify(state));
    setStatus("saved " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("autosave unavailable");
  }
}
function restore() {
  let raw = null;
  try { raw = sessionStorage.getItem(SS_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.drafts) || !parsed.drafts.length) return false;
    parsed.drafts = parsed.drafts.map(function (d) {
      const base = makeDraft(d.label, d.unit);
      const m = Object.assign(base, d, {
        values: d.values || {}, forks: d.forks || {}, esc: d.esc || {},
        naSections: d.naSections || {}, subs: d.subs || {}, blockIds: d.blockIds || []
      });
      // Migrate pre-owner-stack drafts: the old activeTemplate / activeAddendum pair
      // becomes the tail of the one owner stack, in that order.
      if (m.activeTemplate) {
        if (m.blockIds.indexOf(m.activeTemplate) < 0) m.blockIds.push(m.activeTemplate);
        if (m.activeAddendum && m.blockIds.indexOf(m.activeAddendum) < 0) {
          m.blockIds.push(m.activeAddendum);
        }
      }
      delete m.activeTemplate;
      delete m.activeAddendum;
      return m;
    });
    parsed.activeDraft = Math.min(Math.max(0, parsed.activeDraft | 0), parsed.drafts.length - 1);
    state = parsed;
    return true;
  } catch (e) { return false; }
}
function setStatus(t) { document.getElementById("save-state").textContent = t; }

function newCall() {
  openModal({
    title: "New call",
    body: "Wipe this narrative and start a new call? This cannot be undone.",
    actions: [
      { label: "Cancel", cls: "quiet" },
      { label: "New call", cls: "danger", onClick: function () {
          try { sessionStorage.removeItem(SS_KEY); } catch (e) { /* noop */ }
          state = { drafts: [makeDraft("Call")], activeDraft: 0 };
          ui.expanders = {}; ui.polishWarned = false; ui.copyPending = false;
          const cs = document.getElementById("category-select");
          cs.value = "";
          const pv = document.getElementById("preview");
          pv.removeAttribute("contenteditable");
          renderAll();
          setStatus("new call");
        } }
    ]
  });
}

/* ============================ add-block popup ============================ */

/**
 * Two labeled groups: every block, then every template. Templates are stackable
 * mid-chart, so an addendumOnly template belongs here even though it is never a
 * category pick.
 */
function toggleAddBlock() {
  const pop = document.getElementById("add-block-popup");
  if (!pop.hidden) { pop.hidden = true; return; }
  pop.innerHTML = "";
  const group = function (heading, bag) {
    const ids = Object.keys(bag || {});
    if (!ids.length) return;
    pop.appendChild(el("div", "popup-head", heading));
    ids.forEach(function (k) {
      const o = bag[k];
      const btn = el("button", "popup-row", o.name);
      btn.type = "button";
      btn.addEventListener("click", function () { pop.hidden = true; addBlock(o.id); });
      pop.appendChild(btn);
    });
  };
  group("Blocks", DOC.blocks);
  group("Templates", DOC.templates);
  pop.hidden = false;
}

/* ============================ wiring ============================ */

function wire() {
  const us = document.getElementById("unit-select");
  const uo = document.getElementById("unit-other");
  us.addEventListener("change", function () {
    if (us.value === OTHER) { uo.hidden = false; draft().unit = uo.value || ""; uo.focus(); }
    else { uo.hidden = true; draft().unit = us.value; }
    renderForm(); onFormEdit();
  });
  uo.addEventListener("input", function () {
    draft().unit = uo.value;
    repaintUnitLiterals();          // targeted: never rebuild the form while typing here
    renderPreview(); scheduleSave();
  });
  document.getElementById("category-select").addEventListener("change", function (e) {
    pickCategory(e.target.value);
  });
  document.getElementById("add-block").addEventListener("click", function (e) {
    e.stopPropagation(); toggleAddBlock();
  });
  document.addEventListener("click", function (e) {
    const pop = document.getElementById("add-block-popup");
    if (!pop.hidden && !pop.contains(e.target)) pop.hidden = true;
  });
  document.getElementById("new-call").addEventListener("click", newCall);
  document.getElementById("polish-toggle").addEventListener("click", togglePolish);
  document.getElementById("copy-btn").addEventListener("click", doCopy);

  const pv = document.getElementById("preview");
  pv.addEventListener("click", function (e) {
    if (draft().polish) return;                 // polishing: clicks edit text, not jump
    const span = e.target.closest ? e.target.closest(".pv-line") : null;
    if (span && span.dataset.line) jumpToLine(span.dataset.line);
  });
  pv.addEventListener("input", function () {
    const d = draft();
    if (!d.polish) return;
    d.polish.text = pv.innerText;
    d.polish.dirty = true;
    updateCounter(d.polish.text);
    scheduleSave();
  });
}

/* ============================ boot ============================ */

function boot() {
  buildIndexes();
  restore();
  wire();
  const d = draft();
  if (d.polish) {
    const pv = document.getElementById("preview");
    pv.setAttribute("contenteditable", "true");
    pv.textContent = d.polish.text;
  }
  renderAll();
  setStatus("ready");
}
document.addEventListener("DOMContentLoaded", boot);
</script>
